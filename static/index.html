<style>
/* ═══════════════ Genisi G3 — design tokens ═══════════════ */
:root{
  --bg:#060708; --bg-soft:#0a0c0e;
  --rail:#101214; --rail-ic:#c5c7ca; --rail-ic-h:#ffffff;
  --surface:#1b1d20; --surface2:#24262a; --surface3:#2e3134;
  --border:rgba(255,255,255,.075); --border2:rgba(255,255,255,.13);
  --text:#e8eaed; --text2:#a9adb3; --text3:#70747a;
  --blue:#2b5cf0; --blue-h:#3d6bff; --blue-soft:rgba(61,107,255,.16);
  --danger:#e5615e; --ok:#4cbfa6;
  --bubble:#2a2d31;
  --card:#131518; --card-border:rgba(255,255,255,.06);
  --glow:radial-gradient(58% 46% at 50% 106%, rgba(43,79,190,.78) 0%, rgba(24,44,120,.42) 42%, rgba(6,7,8,0) 74%);
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --r-lg:30px; --r-md:18px;
  --font:'DM Sans','Alexandria',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* v58.39: مقياس عرض الديسكتوب — الواجهة تُرسم بمقياس 0.8 (نفس كثافة لقطة
     المستخدم). الغرض: نفس حجم اللوحة والنصوص تماماً بلا الحاجة لتكبير المتصفح.
     الجوال (≤760) يبقى بمقياس 1 لأن له تصميمه الخاص المدموج. */
  --ui-zoom:.78;
}
@media(min-width:761px){ html{zoom:var(--ui-zoom)} }
[data-theme="light"]{
  --bg:#f0f4f9; --bg-soft:#f5f8fd;
  --rail:#f0f3f9; --rail-ic:#444746; --rail-ic-h:#1f1f1f;
  --surface:#ffffff; --surface2:#e4e9f2; --surface3:#d8deea;
  --border:rgba(23,31,52,.10); --border2:rgba(23,31,52,.18);
  --text:#1d2024; --text2:#4c5057; --text3:#8a8f98;
  --blue:#1b53f4; --blue-h:#1b53f4; --blue-soft:rgba(27,83,244,.10);
  --bubble:#e9edf5;
  --card:#f6f8fc; --card-border:rgba(23,31,52,.08);
  --glow:radial-gradient(58% 46% at 50% 106%, rgba(120,150,255,.55) 0%, rgba(160,190,255,.28) 45%, rgba(255,255,255,0) 74%);
  --shadow:0 18px 44px rgba(30,45,90,.12);
}
*{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  overflow:hidden; font-size:15px; line-height:1.65;
  transition:background .35s ease, color .35s ease;
}
::selection{background:rgba(61,107,255,.35)}
button{font-family:inherit; color:inherit; background:none; border:0; cursor:pointer}
textarea,input{font-family:inherit; color:var(--text); background:none; border:0; outline:0}
a{color:var(--blue-h); text-decoration:none}
a:hover{text-decoration:underline}
svg{display:block} button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ic{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.ic.sm{width:18px;height:18px}
.ic.xs{width:16px;height:16px}
[dir="ltr"] .flip{transform:scaleX(-1)}

/* scrollbars */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--surface3); border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}

/* ═══════════════ spark gradient text/orb ═══════════════ */
.spark-grad{background:linear-gradient(120deg,#08a7ff 0%,#9b72cb 42%,#d96570 72%,#f2a60c 100%)}
html.no-anim #sidebar,html.no-anim #drawer,html.no-anim .view,html.no-anim #topbar,html.no-anim #viewHome::before{transition:none!important}

/* ═══════════════ sidebar ═══════════════ */
:root{--side-w:280px; --rail-w:52px}
html.side-collapsed{--side-w:var(--rail-w)}
#sidebar{
  --side-bg:#1e1f20; --side-card:#333537; --side-hover:#2b2d2f;
  --side-ink:#e3e3e3; --side-mut:#9aa0a6; --side-line:rgba(255,255,255,.07);
  --side-accent:#d9a184;
  position:fixed; inset-block:0; inset-inline-start:0; width:280px; max-width:100vw; z-index:90;
  display:flex; flex-direction:column; padding:14px 12px 12px; overflow:hidden;
  background:var(--side-bg); color:var(--side-ink);
  transition:transform .28s cubic-bezier(.32,.72,.25,1), opacity .2s ease;
}
[data-theme="light"] #sidebar{
  --side-bg:#f0f4f9; --side-card:#dde3ea; --side-hover:#e4e9ef;
  --side-ink:#1f1f1f; --side-mut:#5f6368; --side-line:rgba(23,31,52,.08); --side-accent:#b87356;
}
html.side-collapsed #sidebar{transform:translateX(-105%); opacity:0; pointer-events:none}
html[dir="rtl"].side-collapsed #sidebar{transform:translateX(105%)}

/* ═══════════════ icon rail — عمود أيقونات دائم (نمط Gemini) ═══════════════ */
#rail{
  position:fixed; inset-block:0; inset-inline-start:0; width:var(--rail-w); z-index:70;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 10px;
  background:var(--bg); transition:opacity .2s ease, transform .28s cubic-bezier(.32,.72,.25,1);
}
html:not(.side-collapsed) #rail{opacity:0; pointer-events:none; transform:translateX(-14px)}
html[dir="rtl"]:not(.side-collapsed) #rail{transform:translateX(14px)}
.rbtn{
  width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex:none;
  color:var(--rail-ic); transition:background .16s, color .16s, transform .12s;
}
.rbtn:hover{background:var(--surface2); color:var(--rail-ic-h)}
.rbtn:active{transform:scale(.92)}
.rbtn .ic{width:22px; height:22px}
.rbtn.logo{width:42px; height:42px; margin-bottom:7px}
.rbtn.logo img{width:29px; height:29px; object-fit:contain}
.rspacer{flex:1; min-height:8px}
.rbtn.avatar{
  width:32px; height:32px; font-size:12.5px; font-weight:600; color:#fff; margin-top:5px;
  background:linear-gradient(135deg,#08a7ff,#9b72cb); box-shadow:0 0 0 1px rgba(255,255,255,.08);
}
.rbtn.avatar:hover{filter:brightness(1.1)}
@media(max-width:760px){ #rail{display:none} html.side-collapsed{--side-w:0px} }
.sb-brand{display:flex; align-items:center; gap:10px; padding:2px 6px 0; margin-bottom:14px; flex-shrink:0}
.sb-logo{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;flex:none}
.sb-logo img{width:30px;height:30px;object-fit:contain;transition:transform .3s ease, filter .3s ease;filter:drop-shadow(0 0 12px rgba(96,116,255,.22))}
.sb-logo:hover img{transform:scale(1.08);filter:drop-shadow(0 0 16px rgba(96,116,255,.5))}
.sb-wordmark{font-family:var(--font); font-size:17.5px; font-weight:500; letter-spacing:.2px; line-height:1; color:var(--side-ink)}
.sb-sideIcons{margin-inline-start:auto; display:flex; align-items:center; gap:8px}
.sb-topbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--side-mut);transition:background .16s,color .16s;flex:none}
.sb-topbtn:hover{background:var(--side-hover);color:var(--side-ink)}
.sb-topbtn .ic{width:18px;height:18px}
.sb-topbtn.round{background:var(--side-hover);color:var(--side-ink)}
.sb-topbtn.round:hover{background:var(--side-card)}
.sb-new{
  display:flex; align-items:center; gap:14px; width:100%; min-height:44px; padding:10px 16px;
  border-radius:28px; background:var(--side-card);
  color:var(--side-ink); font-size:13.5px; font-weight:500; text-align:start; flex-shrink:0;
  transition:background .16s ease, box-shadow .16s ease;
}
.sb-new:hover{background:#3c3e41; box-shadow:0 2px 10px rgba(0,0,0,.25)}
[data-theme="light"] .sb-new:hover{background:#d3dbe5}
.sb-new .ic{width:20px;height:20px;color:var(--side-ink);flex:none}
.sb-new kbd{display:none}
.sb-menu{display:flex; flex-direction:column; gap:2px; margin-top:9px; flex-shrink:0}
.sb-menuitem{position:relative; display:flex; align-items:center; gap:15px; min-height:40px; padding:9px 14px;
  border-radius:28px; color:var(--side-ink); text-align:start; transition:background .16s}
.sb-menuitem:hover{background:var(--side-hover)}
.sb-menuitem .ic{width:20px;height:20px;flex:none;color:var(--side-ink);opacity:.92}
.sb-menuitem::after{content:attr(data-tip); display:block; white-space:nowrap; font-size:13px; line-height:1.5}
.sb-search{
  display:flex; align-items:center; gap:11px; margin:6px 2px 2px; padding:9px 14px;
  color:var(--side-mut); border-radius:28px; flex-shrink:0;
  transition:background .18s;
}
.sb-search[hidden]{display:none}
.sb-search:focus-within{background:var(--side-hover)}
.sb-search .ic{width:17px;height:17px;flex:none}
.sb-search input{flex:1; min-width:0; font-size:13px; padding:0; color:var(--side-ink)}
.sb-search input::placeholder{color:var(--side-mut); opacity:1}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search input:focus-visible{outline:none}
.sb-scroll{flex:1; min-height:60px; overflow-y:auto; padding:10px 2px 8px; scrollbar-width:none; display:flex; flex-direction:column; gap:12px}
.sb-scroll::-webkit-scrollbar{width:0}
.sb-scroll:hover{scrollbar-width:thin; scrollbar-color:var(--side-hover) transparent}
.sb-scroll:hover::-webkit-scrollbar{width:5px}
.sb-grp{display:flex; flex-direction:column; gap:2px}
.sb-grpHead{display:flex; align-items:center; gap:7px; padding:6px 15px 4px; color:var(--side-mut); font-size:12.5px; flex-shrink:0}
.sb-grpHead[hidden]{display:none}
.sb-grpHead .count{display:none; font:9px ui-monospace,Consolas,monospace; opacity:.75; direction:ltr}
.sb-grpAct{margin-inline-start:auto; width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--side-mut);transition:background .16s,color .16s;flex:none}
.sb-grpAct:hover{background:var(--side-hover);color:var(--side-ink)}
.sb-grpAct .ic{width:15px;height:15px}
.sb-history{display:flex; flex-direction:column; gap:2px; flex-shrink:0}
.sb-item{display:flex; align-items:center; border-radius:26px; position:relative; transition:background .16s}
.sb-item:hover{background:var(--side-hover)}
.sb-item.on{background:var(--side-card)}
.sb-open{display:flex; align-items:center; flex:1; min-width:0; padding:9px 15px; text-align:start}
.sb-open .ic{display:none}
.sb-item.on .sb-open .ic{color:var(--side-accent);opacity:1}
.sb-title{min-width:0;flex:1}
.sb-title span{display:block;font-size:13px;color:var(--side-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6}
.sb-title small{display:none}
.sb-del{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--side-mut);opacity:0;transition:opacity .16s,background .16s,color .16s;flex:none;margin-inline-end:6px}
.sb-item:hover .sb-del,.sb-item:focus-within .sb-del,.sb-item.on .sb-del{opacity:1}
.sb-del:hover{background:var(--side-card);color:var(--danger)}
.sb-del .ic{width:14px;height:14px}
.sb-empty{padding:18px 12px;text-align:center;color:var(--side-mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.6}
.sb-empty svg{width:20px;height:20px;opacity:.35}
.sb-bottom{padding:6px 0 4px; border-top:1px solid var(--side-line); margin-top:8px; flex-shrink:0}
.sb-sync{display:flex;align-items:center;gap:7px;padding:2px 16px 6px;color:var(--side-mut);font-size:9.5px;min-height:16px}
.sb-sync .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none}
.sb-sync .dot.saving{background:var(--side-accent);animation:corePulse 1.2s ease-in-out infinite}
.sb-sync .dot.pending{background:#f2a60c}
.sb-sync .dot.error{background:var(--danger)}
.sb-sync .dot.off{background:var(--text3)}
.sb-sync>span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sync button{margin-inline-start:auto;font-size:10px;color:var(--side-mut);padding:2px 7px;border-radius:7px;flex:none;transition:color .15s,background .15s}
.sb-sync button:hover{color:var(--side-ink);background:var(--side-hover)}
.sb-grp[hidden]{display:none}
.sb-menuitem.on{background:var(--side-card)}
.sb-profile{display:flex; align-items:center; gap:11px; width:100%; padding:7px 10px; border-radius:28px; text-align:start; color:var(--side-ink); transition:background .16s}
.sb-profile:hover{background:var(--side-hover)}
.sb-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#08a7ff,#9b72cb);color:#fff;font-weight:600;font-size:13px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.sb-avatar .ic{width:15px;height:15px}
.sb-profile-name{flex:1;min-width:0;font-size:13px;line-height:1.5}
.sb-profile-name>span,.sb-profile-name small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-profile-name small{color:var(--side-mut);font-size:10px;font-weight:400}
.sb-profile>.ic{width:19px;height:19px;color:var(--side-mut);flex:none}

/* ── sidebar: workspace files / plan badge ── */
.sb-file{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:26px;text-align:start;color:var(--side-ink);transition:background .16s}
.sb-file:hover{background:var(--side-hover)}
.sb-file .fic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--side-hover);color:var(--side-mut);flex:none}
.sb-file .fic .ic{width:13px;height:13px}
.sb-file .fmeta{flex:1;min-width:0}
.sb-file .fname{display:block;font-size:12.5px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.sb-file .fmeta small{display:block;font-size:9.5px;color:var(--side-mut);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.sb-file .fdl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--side-mut);opacity:0;flex:none;transition:opacity .15s,background .15s,color .15s}
.sb-file:hover .fdl,.sb-file:focus-within .fdl{opacity:1}
.sb-file .fdl:hover{background:var(--side-card);color:var(--side-ink)}
.sb-file .fdl .ic{width:13px;height:13px}
.sb-menuitem .pcount{position:absolute; top:50%; inset-inline-end:12px; min-width:15px; height:15px; padding:0 4px; border-radius:99px; background:var(--side-accent); color:#17110d; font:9px/15px ui-monospace,Consolas,monospace; text-align:center; direction:ltr; transform:translateY(-50%)}
.orSep{display:flex;align-items:center;gap:10px;margin:14px 0 12px;color:var(--text3);font-size:11px}
.orSep::before,.orSep::after{content:'';flex:1;border-top:1px solid var(--border)}
.googleBtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:10px 14px;border:1px solid var(--border2);border-radius:12px;color:var(--text);font-size:13px;background:var(--surface)}
.googleBtn:hover{background:var(--surface2);text-decoration:none}
.googleBtn .ic{width:17px;height:17px;color:var(--text2);flex:none}
.pi:disabled{opacity:.82;cursor:default}
.pi:disabled:hover{background:transparent}

/* ═══════════════ top bar ═══════════════ */
#topbar{
  position:fixed; top:0; left:var(--side-w); right:0; height:58px; z-index:50;
  display:flex; align-items:center; gap:10px; padding:0 20px;
  background:linear-gradient(var(--bg) 55%, transparent); pointer-events:none;
  transition:left .28s cubic-bezier(.32,.72,.25,1), right .28s cubic-bezier(.32,.72,.25,1);
}
#topbar>*{pointer-events:auto}
#brand{display:none;align-items:center;gap:8px; font-size:19px; font-weight:500; letter-spacing:.2px; color:var(--text); cursor:default}
@media(max-width:760px){ #brand{display:flex} }
.tbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:background .18s,color .18s}
.tbtn:hover{background:var(--surface2);color:var(--text)}
@media(max-width:640px){ #brand span{display:none} }

/* ── top-right cluster (نمط Gemini: شريحة + زر أزرق + قائمة) ── */
#topActions{margin-inline-start:auto; display:flex; align-items:center; gap:8px}
#topAcct{display:none}
.tchip{
  display:flex; align-items:center; gap:7px; height:36px; padding:0 14px; border-radius:99px;
  color:var(--text2); font-size:13px; font-weight:500; transition:background .18s, color .18s;
}
.tchip:hover{background:var(--surface2); color:var(--text)}
.tchip .ic{width:17px; height:17px}
.tcta{
  display:flex; align-items:center; gap:7px; height:36px; padding:0 18px; border-radius:99px;
  background:var(--blue-h); color:#fff; font-size:13.5px; font-weight:500;
  box-shadow:0 2px 12px rgba(61,107,255,.26); transition:filter .18s, transform .12s;
}
.tcta:hover{filter:brightness(1.09)}
.tcta:active{transform:scale(.97)}
.tcta .ic{width:16px; height:16px}
@media(max-width:860px){ .tchip span{display:none} .tchip{padding:0 10px} }
@media(max-width:560px){ .tcta span{display:none} .tcta{padding:0 12px} }
@media(min-width:761px){ #topbar #sideToggle{display:none} }

/* ═══════════════ views ═══════════════ */
.view{position:fixed; inset:0; left:var(--side-w); display:none; flex-direction:column; transition:left .28s cubic-bezier(.32,.72,.25,1), right .28s cubic-bezier(.32,.72,.25,1)}
.view.on{display:flex}

/* ── home ── */
#viewHome{align-items:center; justify-content:center; overflow-y:auto}
#viewHome::before{
  content:''; position:fixed; inset:0; left:var(--side-w); pointer-events:none;
  background:var(--glow); opacity:var(--glow-o,1);
  transition:opacity .5s, left .28s cubic-bezier(.32,.72,.25,1), right .28s cubic-bezier(.32,.72,.25,1);
}
[data-theme="light"] #viewHome::before{opacity:.5}
.hero{width:min(780px,calc(100% - 44px)); display:flex; flex-direction:column; align-items:center; padding:40px 0 8vh; position:relative; z-index:2}
#homeSlot{width:100%}
#hello{display:flex;align-items:center;gap:9px; color:var(--text2); font-size:17px; margin-bottom:10px}
#hello svg{width:19px;height:19px}
#headline{
  width:100%; max-width:100%; overflow-wrap:break-word;
  font-size:clamp(27px,4.6vw,42px); font-weight:400; letter-spacing:-.4px; text-align:center;
  color:var(--text); margin-bottom:34px; line-height:1.35; min-height:1.35em;
}
#headline .thin{color:var(--text2)}
/* v58.37.b: حُذفت قواعد صفّة الشروط (.chips/.chip) — الشروط لم تعد في الصفحة الرئيسية */

/* ═══════════════ composer ═══════════════ */
.composer{
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:6px 8px 6px; box-shadow:0 4px 24px rgba(0,0,0,.22);
  transition:border-color .25s, box-shadow .25s; position:relative;
}
.composer:focus-within{border-color:var(--border2); box-shadow:0 6px 30px rgba(0,0,0,.3), 0 0 0 1px rgba(61,107,255,.14)}
.crow1{display:flex; align-items:flex-start; padding:12px 12px 4px}
#input{flex:1; resize:none; font-size:16.5px; line-height:1.6; min-height:62px; max-height:240px; padding:6px 2px; background:transparent; caret-color:var(--blue-h)}
#input::placeholder{color:var(--text3)}
.crow2{display:flex; align-items:center; gap:4px; padding:4px 4px 4px 2px}
.cbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:background .18s,color .18s,transform .12s}
.cbtn:hover{background:var(--surface2);color:var(--text)}
.cbtn:active{transform:scale(.9)}
.cbtn.on{color:var(--blue-h); background:var(--blue-soft)}
#toolsBtn{display:flex;align-items:center;gap:7px;width:auto;padding:0 14px 0 10px;font-size:13.5px;font-weight:500;color:var(--text2);border-radius:99px;height:38px}
#toolsBtn:hover{background:var(--surface2);color:var(--text)}
[dir="rtl"] #toolsBtn{padding:0 10px 0 14px}
#modelBtn{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:500;color:var(--text2);padding:8px 10px;border-radius:99px;height:38px;transition:background .18s,color .18s}
#modelBtn:hover{background:var(--surface2);color:var(--text)}
#sendBtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface3);color:var(--text3);transition:all .22s;overflow:hidden}
#sendBtn.ready{background:#fff;color:#0b0d10}
#sendBtn.ready:hover{transform:scale(1.06)}
#sendBtn.stop{background:#fff;color:#0b0d10;border-radius:12px}
[data-theme="light"] #sendBtn.ready,[data-theme="light"] #sendBtn.stop{background:#1d2024;color:#fff}
.attachRow{display:flex;gap:9px;flex-wrap:wrap;padding:8px 10px 2px}
.attach{position:relative;width:58px;height:58px;border-radius:13px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center}
.attach img{width:100%;height:100%;object-fit:cover}
.attach .fname{font-size:9.5px;color:var(--text2);padding:0 4px;text-align:center;overflow:hidden;max-height:34px;word-break:break-all;line-height:1.25}
.attach .rm{position:absolute;top:2px;inset-inline-end:2px;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.attach .rm:hover{background:rgba(0,0,0,.9)}
.micRec #micBtn{color:#fff;background:var(--danger);animation:pulse 1.2s infinite}
/* ── home: composer سطران (النمط الأصلي — v58.37.a: عُد إلى القديم) ── */
.crowFill{flex:1}

/* ── لوحة البحث العائمة (نمط Gemini) ── */
.spanel{width:min(680px,94vw); max-height:min(72vh,640px); display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--border2); border-radius:26px; box-shadow:var(--shadow);
  animation:popIn .26s cubic-bezier(.3,1.1,.4,1); overflow:hidden; text-align:start}
.sphead{display:flex; align-items:center; gap:12px; padding:16px 18px 12px}
.sphead .ic{width:20px; height:20px; color:var(--text3); flex:none}
.sphead input{flex:1; min-width:0; font-size:15.5px; color:var(--text)}
.sphead input::placeholder{color:var(--text3)}
.sphead input::-webkit-search-cancel-button{display:none}
.spLabel{padding:2px 20px 6px; color:var(--text3); font-size:12.5px; font-weight:500}
.spList{overflow-y:auto; padding:0 8px 12px}
.sprow{display:flex; align-items:center; gap:13px; width:100%; padding:11px 12px; border-radius:16px; text-align:start; transition:background .15s}
.sprow:hover{background:var(--surface2)}
.sprow .ic{width:19px; height:19px; color:var(--text3); flex:none}
.sprow .stxt{flex:1; min-width:0; font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sprow .stime{font-size:12px; color:var(--text3); flex:none; white-space:nowrap}
.spanel .sb-empty{padding:22px 12px}

/* ═══════════════ chat view ═══════════════ */
#threadWrap{flex:1; overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth}
#thread{width:min(800px,100%); margin:0 auto; padding:22px 22px 30px; display:flex; flex-direction:column; gap:26px}
#bottom{position:relative; z-index:5; padding:6px 22px 4px; background:linear-gradient(transparent, var(--bg) 34%)}
#bottomInner{width:min(800px,100%); margin:0 auto}
#disclaimer{text-align:center; color:var(--text3); font-size:11.8px; padding:10px 0 12px; user-select:none}
#scrollFab{
  position:absolute; top:-46px; left:50%; transform:translateX(-50%);
  width:40px;height:40px;border-radius:50%; background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); display:grid; place-items:center; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
#scrollFab.show{opacity:1; pointer-events:auto}
#scrollFab:hover{color:var(--text); transform:translateX(-50%) translateY(-2px)}

/* messages */
.msg{display:flex; flex-direction:column; animation:fadeUp .38s ease backwards}
.msg.user{align-items:flex-end}
.msg.user .bubble{
  background:var(--bubble); color:var(--text); border-radius:22px;
  padding:11px 18px; max-width:85%; white-space:pre-wrap; word-break:break-word; font-size:15.5px;
}
.msg.ai{gap:10px}
.ahead{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.ahead svg{width:20px;height:20px}
.ahead .aname{font-size:13.5px;font-weight:500;color:var(--text2)}
.typing-worm{display:inline-flex;align-items:center;gap:3px;width:25px;height:18px;vertical-align:middle}
.typing-worm i{display:block;width:4px;height:4px;border-radius:50%;background:var(--text2);animation:wormCrawl .9s ease-in-out infinite;will-change:transform,opacity}
.typing-worm i:nth-child(2){animation-delay:.12s;opacity:.78}
.typing-worm i:nth-child(3){animation-delay:.24s;opacity:.56}
@keyframes wormCrawl{0%,100%{transform:translateY(2px) scale(.88)}45%{transform:translateY(-3px) scale(1.12)}}
@media(prefers-reduced-motion:reduce){.typing-worm i{animation:none;opacity:.8}}
/* thinking — v58.50: صندوق محتوى مغلق: لا يظهر أي نص تفكير خارجه */
.think{border:1px solid var(--border); border-radius:16px; background:var(--bg-soft); overflow:hidden; max-width:100%; margin-top:2px}
.think>button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 13px;font-size:13px;color:var(--text2);text-align:start;transition:background .16s}
.think>button:hover{background:var(--surface)}
.think .tico{width:17px;height:17px;display:grid;place-items:center;color:var(--text3);flex:none}
.think .tico .ic{width:17px;height:17px}
.think.live .tico{color:var(--blue-h);animation:corePulse 1.6s ease-in-out infinite}
.think .shimmer{
  background:linear-gradient(90deg,var(--text3) 0%, var(--text) 50%, var(--text3) 100%);
  background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shimmer 2.1s linear infinite; font-weight:500;
}
.think.done .shimmer{animation:none; background:none; color:var(--text3); font-weight:400}
.think .tt{color:var(--text3); font-size:12px; margin-inline-start:auto; direction:ltr; font-variant-numeric:tabular-nums}
.think .chev{transition:transform .25s; color:var(--text3)}
.think.open .chev{transform:rotate(180deg)}
.thinkBody{display:none; padding:10px 14px 12px; color:var(--text2); font-size:13px; line-height:1.8; white-space:pre-wrap; word-break:break-word; max-height:200px; overflow-y:auto; border-top:1px solid var(--border); margin:0}
.think.open .thinkBody{display:block}
/* status line */
.status{display:flex; align-items:center; gap:10px; color:var(--text2); font-size:14px; min-height:24px}
.status .orb{width:17px;height:17px;border-radius:50%;border:2px solid var(--surface3);border-top-color:var(--blue-h);animation:spin .9s linear infinite;flex:none}
.status.ok{color:var(--text3)}
.status.ok .orb{animation:none;border-color:var(--ok);display:grid;place-items:center}
.status.err{color:var(--danger)}
.status.err .orb{animation:none;border-color:var(--danger)}
.dots{display:inline-flex;gap:4px;margin-inline-start:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25;animation:blink 1.4s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
/* ═══════════ wait card — the showpiece ═══════════ */
.waitcard{
  border-radius:26px; overflow:hidden; border:1px solid var(--card-border);
  background:
    radial-gradient(120% 90% at 20% 0%, rgba(61,107,255,.10), transparent 55%),
    radial-gradient(120% 100% at 85% 100%, rgba(155,114,203,.08), transparent 50%),
    var(--card);
  position:relative; animation:fadeUp .4s ease;
}
/* مربع إنشاء الصور الحرفي (371×364 بحواف دائرية وتدرج فضي-أبيض ناعم مطابق للصورة المرجعية) */
@keyframes imgSquareSheen{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.waitcard.img-square{
  width:min(100%, 371px);
  aspect-ratio:371 / 364;
  border-radius:28px;
  border:none;
  box-shadow:none;
  background:linear-gradient(128deg, #f2f0f0 0%, #f6f5f5 34%, #fefefe 54%, #f7f6f6 76%, #f3f1f1 100%);
  background-size:215% 215%;
  animation:fadeUp .32s ease, imgSquareSheen 2.8s ease-in-out infinite;
}
.waitcard.img-square .wc-stage{
  width:100%; height:100%; aspect-ratio:auto;
}
.waitcard.img-square.has-img{
  width:fit-content;
  max-width:min(100%, 460px);
  aspect-ratio:auto;
  background:transparent;
  border:1px solid var(--card-border);
  animation:none;
}
.waitcard.img-square.has-img .wc-result img{
  border-radius:27px;
  max-height:520px;
}
.waitcard.img-square.is-err{
  width:100%;
  max-width:460px;
  aspect-ratio:auto;
  background:var(--card);
  border:1px solid var(--card-border);
  animation:none;
}
.wc-stage{position:relative; aspect-ratio:16/9.4; display:grid; place-items:center; overflow:hidden}
.wc-stage.tall{aspect-ratio:16/11}
.wc-sheen{position:absolute; inset:0; pointer-events:none}
.wc-sheen::after{
  content:''; position:absolute; inset:-40%;
  background:linear-gradient(115deg, transparent 36%, rgba(255,255,255,.035) 46%, rgba(255,255,255,.085) 50%, rgba(255,255,255,.035) 54%, transparent 64%);
  animation:sheen 2.8s ease-in-out infinite;
}
.wc-core{display:flex;flex-direction:column;align-items:center;gap:15px;z-index:2}
.wc-orb{position:relative;width:52px;height:52px}
.wc-orb .ring{position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;border-top-color:#4285f4;border-inline-end-color:#9b72cb;animation:spin 1.15s linear infinite}
.wc-orb .core{position:absolute;inset:14px;border-radius:50%;background:linear-gradient(120deg,#08a7ff,#9b72cb 55%,#d96570);opacity:.9;animation:corePulse 1.6s ease-in-out infinite}
.wc-label{font-size:14px;color:var(--text2);display:flex;align-items:center;gap:9px}
.wc-timer{font-size:12.5px;color:var(--text3);direction:ltr;font-variant-numeric:tabular-nums;background:var(--surface2);padding:3px 11px;border-radius:99px}
.wc-note{font-size:12px;color:var(--text3)}
.wc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--card-border);font-size:12.8px;color:var(--text3);min-height:46px}
.wc-foot .fl{display:flex;align-items:center;gap:8px}
.wc-tool{font-size:11.5px;background:var(--surface2);padding:3px 10px;border-radius:99px;color:var(--text2)}
/* result inside card */
.wc-result{position:relative; animation:fadeIn .5s ease}
.wc-result img{width:100%; max-height:560px; object-fit:contain; display:block; background:var(--bg); cursor:zoom-in}
.wc-result video{width:100%; max-height:560px; display:block; background:#000; outline:none}
.wc-result .aud{display:flex;align-items:center;gap:14px;padding:18px 20px;flex-wrap:wrap}
.wc-result .aud audio{flex:1; min-width:210px; height:40px}
.wc-result .aud .disc{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#08a7ff,#9b72cb);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 20px rgba(8,167,255,.22)}
.wc-result .aud-meta{display:flex;flex-direction:column;gap:2px;min-width:120px;max-width:100%;flex:1 1 160px}
.wc-result .aud-meta b{font-size:13.6px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-result .aud-meta small{font-size:11.8px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-link{display:inline-flex;align-items:center;gap:7px;color:inherit;text-decoration:none;max-width:240px}
.att-link .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-expired{opacity:.62;font-size:11.5px;color:var(--text3)}

/* ═══════════ وضع التحدث المباشر (Voice Call — VoxCPM) ═══════════ */
#viewVoice{
  height:100%;
  overflow:hidden;
}
#viewVoice.on{
  display:flex;
  flex-direction:column;
}
.voice-shell{
  flex:1;
  min-height:0;
  width:100%;
  max-width:860px;
  margin:0 auto;
  padding:clamp(12px,2.4vh,24px) clamp(14px,3vw,28px) clamp(16px,2.8vh,26px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.voice-top{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.voice-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 13px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--border);
  font-size:12.4px;
  color:var(--text2);
}
.voice-badge .vdot{
  width:8px; height:8px; border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,.18);
}
.voice-top-actions{
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.voice-chip-btn{
  height:36px;
  padding:0 13px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text2);
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:12.4px;
  transition:all .18s ease;
}
.voice-chip-btn:hover{background:var(--surface2);color:var(--text)}
.voice-chip-btn.on{border-color:rgba(8,167,255,.45);color:var(--blue-h);background:var(--blue-soft)}
.voice-chip-btn.end{border-color:rgba(239,68,68,.35);color:#ef4444;background:rgba(239,68,68,.08)}
.voice-chip-btn.end:hover{background:rgba(239,68,68,.16)}
.voice-center{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
}
/* المربع المخصص لوضع التحدث فقط (بنفس تناسب 371×364 وحواف دائرية ناعمة متناغمة مع واجهة Genisi) */
.voice-stage-box{
  position:relative;
  width:min(74vw, 340px);
  max-height:min(44vh, 334px);
  aspect-ratio:371 / 364;
  border-radius:28px;
  background:linear-gradient(128deg, #f2f0f0 0%, #f6f5f5 34%, #fefefe 54%, #f7f6f6 76%, #f3f1f1 100%);
  background-size:210% 210%;
  box-shadow:0 18px 48px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.85);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  cursor:pointer;
  user-select:none;
  overflow:hidden;
  transition:transform .25s ease, box-shadow .25s ease;
}
[data-theme="dark"] .voice-stage-box{
  background:
    radial-gradient(95% 95% at 76% 20%, rgba(255,255,255,.09), transparent 58%),
    linear-gradient(132deg, rgba(31,35,44,.96) 0%, rgba(39,45,58,.96) 44%, rgba(50,58,74,.94) 56%, rgba(28,32,41,.98) 100%);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 22px 56px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
}
.voice-stage-box:hover{transform:translateY(-2px)}
.voice-stage-box[data-vstate="listening"]{
  box-shadow:0 20px 54px rgba(8,167,255,.24), 0 0 0 2px rgba(8,167,255,.38);
}
.voice-stage-box[data-vstate="speaking"]{
  animation:imgSquareSheen 3.2s ease-in-out infinite;
  box-shadow:0 22px 58px rgba(155,114,203,.26), 0 0 0 2px rgba(155,114,203,.38);
}
.voice-orb-wrap{
  position:relative;
  width:116px;
  height:116px;
  display:grid;
  place-items:center;
}
.voice-orb-halo{
  position:absolute;
  inset:-10px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(8,167,255,.28), rgba(155,114,203,.16) 55%, transparent 72%);
  transform:scale(var(--v-level, 1));
  transition:transform .08s linear;
}
.voice-orb-core{
  position:relative;
  width:84px;
  height:84px;
  border-radius:50%;
  background:linear-gradient(135deg, #08a7ff 0%, #6b7cff 52%, #9b72cb 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#fff;
  box-shadow:0 10px 28px rgba(8,167,255,.32);
  transform:scale(calc(0.96 + (var(--v-level, 1) - 1) * 0.45));
  transition:transform .08s linear;
}
.voice-bars{
  display:inline-flex;
  align-items:center;
  gap:4px;
  height:32px;
}
.voice-bars i{
  display:block;
  width:4.5px;
  height:10px;
  border-radius:99px;
  background:#fff;
  transition:height .09s ease;
}
.voice-stage-box[data-vstate="thinking"] .voice-orb-core,
.voice-stage-box[data-vstate="synthesizing"] .voice-orb-core{
  animation:corePulse 1.35s ease-in-out infinite;
}
.voice-stage-status{
  font-size:13px;
  font-weight:500;
  color:#3c424d;
  padding:4px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.045);
  max-width:88%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
[data-theme="dark"] .voice-stage-status{
  color:var(--text2);
  background:rgba(255,255,255,.06);
}
.voice-captions{
  width:min(100%, 660px);
  min-height:54px;
  max-height:112px;
  overflow-y:auto;
  text-align:center;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:2px 10px;
}
.voice-cap-user{
  font-size:13px;
  color:var(--text3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.voice-cap-ai{
  font-size:15px;
  line-height:1.6;
  color:var(--text);
  font-weight:450;
}
/* شريط الإدخال الخاص بوضع التحدث فقط — مطابق لطول وعرض الشريط الأفقي النحيف (660×64px) ومتناغم مع واجهة Genisi */
.voice-bottom{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.voice-pill-bar{
  width:min(100%, 660px);
  height:64px;
  min-height:64px;
  max-height:64px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--border2);
  box-shadow:0 8px 28px rgba(0,0,0,.14);
  padding:0 12px 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
[data-theme="light"] .voice-pill-bar{
  background:#ffffff;
  border-color:rgba(23,31,52,.11);
  box-shadow:0 8px 26px rgba(18,32,62,.08);
}
.voice-pill-bar:focus-within{
  border-color:rgba(8,167,255,.48);
  box-shadow:0 10px 32px rgba(8,167,255,.14);
}
.voice-pill-bar .vp-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--text2);
  background:transparent;
  flex:none;
  transition:background .16s ease, color .16s ease, transform .16s ease;
}
.voice-pill-bar .vp-btn:hover{
  background:var(--surface2);
  color:var(--text);
}

/* generic file result */

/* ═══════════════ tool rows (agent-style cards) ═══════════════ */
.toolbox{display:flex; flex-direction:column; gap:8px}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:500}
.field input,.field select{
  width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:13px;
  padding:11px 14px;font-size:14px;color:var(--text);transition:border-color .2s;
}
.field input:focus{border-color:var(--blue-h)}
.field select option{background:var(--rail)}
.mrow{display:flex;gap:9px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:14px;font-size:14px;font-weight:500;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}

.mtabs{display:flex;background:var(--surface);border-radius:13px;padding:4px;margin-bottom:18px}

.setRow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 2px;border-bottom:1px solid var(--border)}

.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px}

.acctHead{display:flex;align-items:center;gap:14px;margin-bottom:16px}

.planCard{background:linear-gradient(135deg,rgba(8,167,255,.12),rgba(155,114,203,.10) 50%,rgba(242,166,12,.10));border:1px solid var(--border2);border-radius:18px;padding:15px 17px;margin-bottom:14px;display:flex;align-items:center;gap:12px}

/* ═══════════════════════════════════════════════════════════════
   v58.39 — الجوال: دمج تصميم Gemini القديم + الجديد
   الجديد: شعار/شرارة كبيرة في الوسط + عنوان كبير + خلفية متدرّجة + شريط
            إدخال من سطر واحد + شريط علوي نحيف (نموذج + محادثة جديدة).
   القديم: التحية + قائمة اقتراحات عمودية + زر «أدوات» + موديل + ماكروفون
            + شريط إدخال من سطرين أثناء المحادثة.
   ═══════════════════════════════════════════════════════════════ */
/* زر الموديل العلوي — جوال فقط */
#modelChipTop{display:none}
@media(max-width:760px){
  #modelChipTop{display:flex; align-items:center; gap:4px; height:34px; padding:0 11px; border-radius:99px;

  #modelChipTop .mname{white-space:nowrap; display:inline !important}
}
#sugList{display:none}
.sug{
  display:flex; align-items:center; gap:11px; padding:8px 13px; border-radius:13px;
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  font-size:13.5px; font-weight:500; text-align:start; transition:all .16s ease;
}

.sug svg{width:16px; height:16px; flex:none}
.sug .slabel{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
[dir="rtl"] .sug .slabel{text-align:start}
[data-theme="light"] .sug{background:rgba(255,255,255,.72); backdrop-filter:blur(6px); border-color:rgba(23,31,52,.10)}

  :root{--side-w:0px; --ui-zoom:1}
  #sidebar{width:min(300px,86vw); padding:22px 14px 12px; box-shadow:18px 0 60px rgba(0,0,0,.35)}
  html[dir="rtl"] #sidebar{box-shadow:-18px 0 60px rgba(0,0,0,.35)}
  #topbar{padding:0 12px; height:52px}
  #thread{padding:16px 14px 24px}
  #bottom{padding:6px 10px 4px}
  .msg.user .bubble{max-width:92%}
  #drawer{top:0;bottom:0;inset-inline-end:0;width:100%;max-width:none;border-radius:0}
  #rail{display:none}

  /* ── خلفية متدرّجة (الجديد) ── */
  #viewHome::before{
    background:
      radial-gradient(120% 62% at 50% 108%, rgba(56,120,255,.62) 0%, rgba(28,74,190,.30) 44%, transparent 72%),
      radial-gradient(90% 46% at 12% 4%, rgba(120,190,255,.20), transparent 60%),
      radial-gradient(80% 40% at 92% 0%, rgba(155,114,203,.18), transparent 62%);
    opacity:1;
  }
  [data-theme="light"] #viewHome::before{
    background:
      radial-gradient(130% 66% at 50% 110%, rgba(88,150,255,.55) 0%, rgba(150,196,255,.32) 46%, transparent 74%),
      linear-gradient(180deg, #eef4ff 0%, #f7faff 42%, #e4efff 100%);
    opacity:1;
  }
  #viewHome{align-items:stretch; justify-content:flex-start}
  .hero{width:100%; max-width:none; height:100%; padding:0 18px 14px; gap:0; justify-content:flex-start}
  /* v58.39: كتلة المحتوى (شعار + عنوان + اقتراحات) في وسط الشاشة، والشريط في الأسفل */
  #hello{flex-direction:column; align-items:flex-start; gap:6px; margin:0; padding:64px 0 0; width:100%}
  #hello svg{display:none}
  #hello span{font-size:15px; color:var(--text2)}
  #hello svg{width:42px; height:42px; filter:drop-shadow(0 0 16px rgba(96,116,255,.35))}

  #headline{font-size:26px; font-weight:500; line-height:1.35; margin-bottom:26px; text-align:start; width:100%}
  html[lang="ar"] #headline{font-size:23px; line-height:1.5}

  /* ── الاقتراحات بنمط Gemini: حبوب يسارية الاصطفاف (v58.41) ── */
  #sugList{display:flex; flex-direction:column; align-items:flex-start; gap:10px; width:100%; max-width:none; margin:22px 0 0; padding:0}
  #sugList .sug{border-radius:99px; padding:11px 18px; font-size:14px; box-shadow:0 2px 10px rgba(0,0,0,.14); background:var(--surface)}
  #sugList .sug .sarw{display:none}
  /* أول رسالة لا تُختبئ خلف الشريط العلوي */
  #threadWrap{padding-top:54px}

  /* ── شريط الإدخال: طابقان ملتصقان بحواف الشاشة (v58.42) ──
     الطابق العلوي: حقل الإدخال — الطابق السفلي: [+][أدوات] … [الموديل][مايك][إرسال] */
  #bottom{padding:0}
  #bottomInner{width:100%; max-width:none}
  #viewHome .hero{padding-bottom:0; padding-inline:0}
  #viewHome #homeSlot{width:100%; margin-top:auto; padding:0}
  #viewHome #hello,#viewHome #headline,#viewHome #sugList{padding-inline:18px}
  .composer{width:100%; max-width:none; border-radius:24px 24px 0 0; border-inline:0; border-bottom:0; padding:8px 10px 12px; box-shadow:0 -10px 34px rgba(0,0,0,.28)}
  .crow1{padding:10px 8px 4px}
  #input{min-height:42px; max-height:150px; font-size:16px}
  .crow2{display:flex; align-items:center; gap:4px; padding:2px 2px 0}
  #toolsBtn span{display:inline}
  #modelBtn{height:34px; padding:6px 12px; font-size:13px; border-radius:99px; border:1px solid var(--border2); background:var(--surface2)}
  #sendBtn{border-radius:50%}

  /* ── شريط علوي نحيف: موديل + محادثة جديدة (الجديد) ── */
  #topActions{gap:6px}
  #filesChip{display:none}
  #newChatCta{padding:0; width:38px; height:38px; justify-content:center}
  #newChatCta > span:not(.ctaIc){display:none}
  #newChatCta .ctaIc{display:block; width:19px; height:19px}
  #newChatCta .ctaIc svg{width:19px; height:19px}
  #modelChipTop{display:flex; align-items:center; gap:4px; height:34px; padding:0 10px; border-radius:99px;
    background:var(--surface); border:1px solid var(--border); color:var(--text2); font-size:13px; font-weight:500}
  #modelChipTop .ic{width:15px; height:15px}
  #modelChipTop .mname{white-space:nowrap; display:inline !important}
  #brand{display:flex; flex:1; justify-content:center; font-size:19px}
  #brand span{display:inline}
  .tbtn{width:38px; height:38px}
  #modelChipTop{display:none}
  #newChatCta{display:none}
  #kebabBtn{display:none}
  body.in-chat #kebabBtn{display:grid}
  #topAcct{display:grid; width:34px; height:34px; border-radius:50%; place-items:center; font-size:13px; font-weight:600; color:#fff; background:linear-gradient(135deg,#08a7ff,#9b72cb); flex:none}

  /* ── المحادثة: شريط سطرين (القديم) + فراغات أنعم ── */
  #thread{width:100%; gap:20px}
  .msg.user .bubble{border-radius:20px; padding:10px 15px; font-size:15px}
  html[lang="ar"] .msg.user .bubble{font-size:15px; line-height:1.75}
  html[lang="ar"] .body{font-size:15.5px; line-height:1.85}
  #disclaimer{font-size:11px; padding:8px 0 10px}
  .waitcard{border-radius:20px}
  .think{border-radius:14px}
}
@media(max-width:860px){ .tchip > span{display:none} #filesChipLbl{display:inline !important} #modelChipTop .mname{display:inline !important} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* keyframes */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes sheen{0%{transform:translateX(-38%)}55%,100%{transform:translateX(38%)}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes caret{50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@keyframes corePulse{0%,100%{transform:scale(.86);opacity:.75}50%{transform:scale(1.08);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,97,94,.5)}50%{box-shadow:0 0 0 9px rgba(229,97,94,0)}}

/* ═══ v58.40: واجهة LTR دائماً — النص العربي (وسائر النصوص) يتبع لغته تلقائياً ═══ */
.msg.user .bubble,.body,.thinkBody,.status,.wc-label,.wc-note,.wc-foot,
#headline,#hello,.sug .slabel,.sb-title span,.toast span,#disclaimer,
.busyNote,.spLabel,.tdetails summary,.wc-timer,.think>button,.filerow .fmeta b,
#acctName,#planName,#planDesc,.sb-profile-name,.gal-head b{unicode-bidi:plaintext}
html[lang="ar"] body,html[lang="ar"] body *:not(svg):not(svg *){font-family:'Alexandria','DM Sans',system-ui,sans-serif;font-weight:300!important}
html[lang="ar"] pre,html[lang="ar"] code,html[lang="ar"] kbd{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace!important;font-weight:400!important}

/* ═══ v58.50: التفكير داخل صندوق واحد مكتمل — لا نص تفكير عائم خارجه ═══ */
.msg.ai .think{
  border:1px solid var(--border); background:var(--bg-soft); border-radius:16px;
  overflow:hidden; max-width:100%; margin-top:2px; min-width:0; contain:layout paint;
}
.msg.ai .think>button{
  display:flex; align-items:center; gap:8px; width:100%; padding:9px 13px;
  border-radius:0; font-size:12.9px; transition:background .15s;
}
.msg.ai .think>button:hover{background:var(--surface)}
.msg.ai .think .thinkBody{
  background:transparent; border:0; border-top:1px solid var(--border);
  border-radius:0; padding:10px 14px 12px; margin:0; color:var(--text2);
  font-size:12.7px; font-weight:300; line-height:1.8; text-align:start;
  max-height:200px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
  width:100%; max-width:100%; min-width:0; box-sizing:border-box;
  overflow-wrap:anywhere; word-break:break-word;
}
.msg.ai .ahead .shimmer{font-size:12.8px}
.msg.ai .think .shimmer{font-size:12.9px}

/* ═══ v58.45: rail + topbar شفافان ليتبعان لون الخلفية (ديسكتوب وجوال) ═══ */
#rail{background:transparent}
#topbar{background:transparent}

/* ═══ v58.49: إخفاء إخلاء المسؤولية على الجوال ═══ */
@media(max-width:760px){ #disclaimer{display:none} }

/* ═══════════════════════════ backend-compatible helpers ═══════════════════════════ */
function normalizeUser(raw){
  if (!raw) return null;
  if (typeof raw === 'string') raw = raw.includes('@') ? {email: raw} : {username: raw};
  const email = String(raw.email || '').trim();
  const username = String(raw.username || raw.user || (email ? email.split('@')[0] : '')).trim();
  return Object.assign({}, raw, {username, email, plan: String(raw.plan || 'free')});
}
function userScope(u){
  if (!u) return 'LOCAL';
  const plan = String(u.plan || 'free').toUpperCase();
  return plan === 'FREE' ? 'FREE' : plan;
}
function fmtBytes(n){
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  const units = ['KB','MB','GB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
  return n.toFixed(n >= 10 ? 0 : 1) + ' ' + units[i];
}
function fileBase(p){ return String(p || '').split(/[\\/]/).pop() || ''; }
function fileDir(p){ const a = String(p || '').split(/[\\/]/); a.pop(); return a.join('/'); }
function fileIcon(p){
  const m = fileBase(p).match(/\.([a-z0-9]+)$/i);
  const e = m ? m[1].toLowerCase() : '';
  if (/^(png|jpe?g|webp|gif|svg|bmp|ico)$/.test(e)) return I.image;
  if (/^(mp4|webm|mov|mkv)$/.test(e)) return I.video;
  if (/^(mp3|wav|ogg|m4a)$/.test(e)) return I.audio;
  if (/^(html?|css|js|mjs|ts|tsx|jsx|py|json|sql|sh|bat|ps1|md|txt)$/.test(e)) return I.code;
  if (/^(pdf|docx?|pptx?|xlsx?)$/.test(e)) return I.doc;
  return I.file;
}
async function authBlob(url){
  const r = await api(url);
  if (!r.ok){
    let detail = '';
    try { detail = (await r.json()).detail || ''; } catch (e) {}
    throw new Error(detail || ('http ' + r.status));
  }
  return await r.blob();
}
async function downloadUrl(url, name){
  try {
    const blob = await authBlob(url);
    const a = document.createElement('a');
    const u = URL.createObjectURL(blob);
    a.href = u; a.download = name || 'genisi'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  } catch (e) { toast(T().errNet, true); }
}
const MIME_EXT = {'image/jpeg':'.jpg', 'image/png':'.png', 'image/webp':'.webp', 'image/gif':'.gif', 'image/svg+xml':'.svg', 'video/mp4':'.mp4', 'video/webm':'.webm', 'audio/mpeg':'.mp3', 'audio/wav':'.wav', 'audio/ogg':'.ogg'};
function downloadAsset(url, name){
  if (!url) return;
  if (/^(blob:|data:)/i.test(url)){
    /* v58.63: الصور المولّدة كانت تُنزَّل باسم «genisi» بلا امتداد — نستنتج الامتداد من نوع الـ blob */
    if (/\.[a-z0-9]{2,5}$/i.test(name || '')){ dlUrl(url, name); return; }
    fetch(url).then(r => r.blob()).then(b => dlUrl(url, (name || 'genisi') + (MIME_EXT[String(b.type).split(';')[0]] || ''))).catch(() => dlUrl(url, name));
    return;
  }
  try {
    const u = new URL(url, location.href);
    if (u.origin === location.origin && u.pathname === '/api/workspace/download'){ downloadUrl(u.href, name); return; }
  } catch (e) {}
  dlUrl(url, name);
}
async function previewWorkspace(path){
  const name = fileBase(path);
  const e = (name.match(/\.([a-z0-9]+)$/i) || [])[1] ? (name.match(/\.([a-z0-9]+)$/i) || [])[1].toLowerCase() : '';
  const win = window.open('', '_blank');
  try {
    if (/^(png|jpe?g|webp|gif|svg|bmp|ico|pdf|mp4|webm|mov|mkv|mp3|wav|ogg|m4a)$/.test(e)){
      const blob = await authBlob('/api/workspace/download?path=' + encodeURIComponent(path));
      const type = /^(png|jpe?g|webp|gif|svg|bmp|ico)$/.test(e) ? 'image/' + (e === 'jpg' ? 'jpeg' : e)
        : /^(mp4|webm|mov|mkv)$/.test(e) ? 'video/' + e
        : /^(mp3|wav|ogg|m4a)$/.test(e) ? 'audio/' + (e === 'm4a' ? 'mp4' : e) : 'application/pdf';
      const u = URL.createObjectURL(new Blob([blob], {type}));
      if (win) win.location = u; else window.open(u, '_blank', 'noopener');
      setTimeout(() => URL.revokeObjectURL(u), 120000);
      return;
    }
    const j = await apiJ('/api/workspace/file?path=' + encodeURIComponent(path));
    if (j.success === false) throw new Error(j.error || 'file');
    const type = /\.html?$/i.test(name) ? 'text/html;charset=utf-8'
      : /\.svg$/i.test(name) ? 'image/svg+xml'
      : /\.json$/i.test(name) ? 'application/json;charset=utf-8'
      : 'text/plain;charset=utf-8';
    const u = URL.createObjectURL(new Blob([String(j.content || '')], {type}));
    if (win) win.location = u; else window.open(u, '_blank', 'noopener');
    setTimeout(() => URL.revokeObjectURL(u), 120000);
  } catch (err) {
    try { win && win.close(); } catch (e) {}
    toast(T().errNet, true);
  }
}

async function api(path, opts = {}){
  const h = Object.assign({}, opts.headers || {});
  // Genisi uses an HttpOnly same-origin session cookie, never a browser-held HF bearer token.
  delete h.Authorization; delete h.authorization;
  const method = String(opts.method || 'GET').toUpperCase();
  if (['POST','PUT','PATCH','DELETE'].includes(method)) {

function inferAttKind(mime){
  const m = String(mime || '').toLowerCase();
  if (m.startsWith('image/')) return 'image';
  if (m.startsWith('video/')) return 'video';
  if (m.startsWith('audio/')) return 'audio';
  return 'file';
}
function addFiles(list){
  const t = T();
  let added = 0;
  for (const f of Array.from(list || [])){
    if (S.attachments.length >= 6){ toast(t.attachMax, true); break; }
    if (f.size > 24 * 1024 * 1024){ toast(t.fileBig + (f.name ? ' — ' + f.name : ''), true); continue; }
    if (!f.size) continue;
    const aid = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    const mime = f.type || 'application/octet-stream';
    const kind = inferAttKind(mime);
    const name = f.name || 'file';
    const objUrl = URL.createObjectURL(f);
    mediaPut({id: aid, kind: kind, mime: mime, name: name, size: f.size, blob: f});
    MEDIA.urls.set(aid, objUrl);
    if (syncMediaBlobHook) syncMediaBlobHook(aid, f, {kind: kind, mime: mime, name: name});
    S.attachments.push({id: aid, kind: kind, name: name, mime: mime, size: f.size, url: objUrl, dbUrl: '/api/media/' + aid, file: f});
    added++;
  }
  if (added) renderAttach();

}

/* v58.63 — إصلاح عرض الرياضيات: العلامة القديمة "\u0000M<n>\u0000" كانت تتحوّل داخل marked إلى U+FFFD
   فلا تُستعاد أبداً وتظهر المعادلات كـ "M0" و"M1". العلامات الآن من نطاق الاستخدام الخاص (U+E000/U+E001)،
   والكود (المسوّر والسطري) لا يُمسّ، وكل معادلة تُرسم مباشرة بـ katex (حتى أثناء البث). */
const MATH_L = '\uE000', MATH_R = '\uE001';
const MATH_CACHE = new Map();
function protectMath(src){
  const store = [], codes = [];
  const put = (raw, tex, display) => { store.push({raw: raw, tex: String(tex).trim(), display: display}); return MATH_L + 'M' + (store.length - 1) + MATH_R; };
  const hold = m => { codes.push(m); return MATH_L + 'C' + (codes.length - 1) + MATH_R; };
  const prose = s => {
    if (!s) return s;
    s = s.replace(/(`{1,3})(?!`)[^\n]*?\1(?!`)/g, hold);
    if (s.indexOf('$') >= 0){
      s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, b) => put(m, b, true));
      s = s.replace(/(^|[^\\$])\$(?!\s)((?:[^$\n\\]|\\.)*?(?:[^\s$\\]|\\[^\s]))\$(?!\d)/g, (m, pre, b) => pre + put('$' + b + '$', b, false));
    }
    if (s.indexOf('\\') >= 0){
      s = s.replace(/\\\[([\s\S]+?)\\\]/g, (m, b) => /^[\s\d,;.\-–]*$/.test(b) ? m : put(m, b, true));
      s = s.replace(/\\\(([\s\S]+?)\\\)/g, (m, b) => put(m, b, false));
    }
    s = s.replace(/(^|[^!])((?:https?:\/\/|\/api\/media\/)[^\s<)"']+\.(?:png|jpe?g|webp|gif)(?:\?[^\s<)"']*)?)/g, (m, pre, url) => /[=(]\s*$/.test(pre) ? m : pre + '![](' + url + ')');
    return s.replace(/\uE000C(\d+)\uE001/g, (m, i) => codes[+i]);
  };
  const lines = String(src == null ? '' : src).replace(/[\uE000\uE001]/g, '').split('\n');
  const out = []; let buf = [], fence = '';
  const flush = isCode => { if (buf.length){ const s = buf.join('\n'); out.push(isCode ? s : prose(s)); buf = []; } };
  for (const ln of lines){
    const m = ln.match(/^\s*(`{3,}|~{3,})(.*)$/);
    if (fence){
      buf.push(ln);
      if (m && m[1][0] === fence[0] && m[1].length >= fence.length && !m[2].trim()){ flush(true); fence = ''; }
    } else if (m && !(m[1][0] === '`' && m[2].indexOf('`') >= 0)){
      flush(false); fence = m[1]; buf.push(ln);
    } else buf.push(ln);
  }
  flush(!!fence);
  return {src: out.join('\n'), store: store};
}

      '</div></div></div>';
    const au = card.querySelector('audio');
    const fallbackUrl = (x.url && !/^\/api\/media\//.test(x.url)) ? x.url : '';
    const ready = u => {
      const src = u || fallbackUrl;
      if (!src){ mediaGoneRow(card, I.music); return; }
      au.onerror = () => {
        if (src !== fallbackUrl && fallbackUrl){ au.src = fallbackUrl; return; }
        mediaGoneRow(card, I.music);
      };
      au.src = src;
      card.querySelector('.aud-dl').onclick = () => downloadAsset(src, x.name || 'genisi-audio.mp3');
    };
    if (x.id) mediaUrl(x.id).then(ready); else ready(x.url || '');
  } else if (x.kind === 'file'){
    const name = x.name || 'document';
    card.innerHTML = '<div><div class="wc-result"><div class="filerow"><div class="fico">' + I.file + '</div><div class="fmeta"><b>' + esc(name) + '</b><span>' + esc(x.note || '') + '</span></div></div></div></div>';
    const row = card.querySelector('.filerow');
    const mk = (ic, title, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'miniBtn'; b.title = title; b.innerHTML = ic; b.onclick = fn; row.appendChild(b); };
    mediaGetOrFetch(x.id).then(rec => {
      if (!rec || !rec.blob){ card.querySelector('.fmeta span').textContent = t.mediaGone; return; }
      if (rec.html && filePreviewHook) mk(I.play, t.preview, () => filePreviewHook({format: rec.format, name: rec.name || name, html: rec.html}));
      mk(I.download, t.download, () => { const u = URL.createObjectURL(rec.blob); dlUrl(u, name); setTimeout(() => URL.revokeObjectURL(u), 60000); });
    });
  } else return null;
  return card;
}

function relTime(ts){
  const t = T();
  if (!ts) return '';
  const d = Math.max(0, (Date.now() - ts) / 1000);
  if (d < 60) return t.now;
  if (d < 3600) return t.minN.replace('{n}', Math.floor(d / 60));
  if (d < 86400) return t.hourN.replace('{n}', Math.floor(d / 3600));
  const days = Math.floor(d / 86400);
  if (days === 0) return t.today;
  if (days === 1) return t.yesterday;
  if (days < 7) return t.dayN.replace('{n}', days);
  if (days < 30) return t.weekN.replace('{n}', Math.floor(days / 7));
  return t.monthN.replace('{n}', Math.floor(days / 30));
}

let tsX = 0, tsY = 0;

document.addEventListener('touchend', e => {

function imageUrlsIn(text){
  const out = [], re = /(?:https?:\/\/|\/api\/media\/)[^\s<)"']+(?:\.png|\.jpe?g|\.webp|\.gif)(?:\?[^\s<)"']*)?/g;
  (String(text || '').match(re) || []).forEach(u => { if (!out.includes(u)) out.push(u); });
  return out;
}
/* v58.63: المعرض يضم الآن الصور المولَّدة المحفوظة (m.media) لا روابط http داخل النص فقط */
function galleryItems(){
  const out = [], seen = new Set();
  S.sessions.forEach(s => (s.msgs || []).forEach(m => {
    if (!m || m.role !== 'assistant') return;
    (m.media || []).forEach(x => {
      if (!x || x.kind !== 'image') return;
      const k = x.id || x.url;
      if (k && !seen.has(k)){ seen.add(k); out.push(x.id ? {id: x.id} : {url: x.url}); }
    });
    imageUrlsIn(m.content).forEach(u => { if (!seen.has(u)){ seen.add(u); out.push({url: u}); } });
  }));
  return out;
}

/* ═══════════════════════════ session mgmt ═══════════════════════════ */
function newSession(){ goHome(); }
/* v58.63 — أمان الجلسات: الدور الجاري يحمل مرجع محادثته (live.sessMsgs / live.sess).
   عند مغادرة المحادثة أثناء البث نوقف التوليد ونحفظ الجزء المكتوب في محادثته هو.
   (سابقاً: فتح محادثة أخرى أثناء البث كان يكتب الجواب فيها، و«محادثة جديدة» كانت تضيّعه.) */
function commitAssistant(l, text){
  const msgs = (l && l.sessMsgs) || S.msgs;
  const media = ((l && l.media) || []).slice();
  if (!String(text || '').trim() && !media.length) return false;   // لا تُحفظ رسالة مساعد فارغة
  const m = {role: 'assistant', content: text || ''};
  if (media.length) m.media = media;
  msgs.push(m);
  if (l && l.sess) l.sess.msgs = msgs;
  else if (S.cur >= 0 && msgs === S.msgs && S.sessions[S.cur]) S.sessions[S.cur].msgs = S.msgs;
  return true;
}
function detachLiveTurn(){
  if (!live) return;
  const l = live;
  if (S.streaming){ try { stopStream(); } catch (e) {} }
  clearInterval(l.timer);
  if (paintTimer){ clearTimeout(paintTimer); paintTimer = 0; }
  let text = '';
  try { text = stripCardMedia(visibleAnswer(l.finalText != null ? l.finalText : l.raw)).replace(/^(?:[ \t]*\n)+/, '').replace(/\s+$/, ''); } catch (e) {}
  live = null;
  if (commitAssistant(l, text)) saveHistory();
}
let closeVoiceCallHook = null;
function goHome(){
  /* v58.38: «محادثة جديدة» كانت تُفرغ S.msgs فقط — فتبقى رسائل الجلسة السابقة في DOM
     (#thread) وتظهر من جديد فوق المحادثة الجديدة (المشكلة المرئية في التسجيل). */
  if (closeVoiceCallHook) closeVoiceCallHook(true);
  detachLiveTurn();
  S.cur = -1; S.msgs = [];
  $('#thread').innerHTML = '';
  $('#viewHome').classList.add('on'); $('#viewChat').classList.remove('on'); $('#viewVoice').classList.remove('on');
  document.body.classList.remove('in-chat');
  placeComposer(false); renderHomeHero(); renderSessions();
  if (onThreadSwitch) onThreadSwitch();
}
function openSession(i){
  const s = S.sessions[i]; if (!s) return;
  if (i === S.cur && live && S.streaming) return;   // المحادثة الجارية نفسها: لا نقطع بثّها
  if (closeVoiceCallHook) closeVoiceCallHook(true);
  detachLiveTurn();
  S.cur = i;
  S.msgs = (s.msgs || []).map(m => {
    const o = {role: m.role, content: m.content || ''};
    if (Array.isArray(m.media) && m.media.length) o.media = m.media;
    if (Array.isArray(m.atts) && m.atts.length) o.atts = m.atts;
    if (m.docs) o.docs = m.docs;
    return o;
  });
  s.msgs = S.msgs;
  $('#viewHome').classList.remove('on'); $('#viewVoice').classList.remove('on'); $('#viewChat').classList.add('on'); placeComposer(true); document.body.classList.add('in-chat');
  renderThreadStatic(); renderSessions();
  if (onThreadSwitch) onThreadSwitch();
}
function renderThreadStatic(){
  const th = $('#thread'); th.innerHTML = '';
  const n = S.msgs.length;
  S.msgs.forEach((m, k) => { m.role === 'user' ? addUserBubble(m.content, m.atts, true) : addAiStatic(m.content, m.media, k === n - 1); });
  scrollBottom(true);
}
function addUserBubble(text, atts, silent){
  const d = document.createElement('div'); d.className = 'msg user';
  if (text || !(atts && atts.length)){
    const b = document.createElement('div'); b.className = 'bubble'; b.dir = 'auto';
    b.textContent = text;
    d.appendChild(b);
  }
  if (atts && atts.length){
    const row = document.createElement('div'); row.className = 'attachRow'; row.style.cssText = 'justify-content:flex-end;margin-top:8px';
    atts.forEach(a => {
      const el = document.createElement('div'); el.className = 'attach';
      if (a.expired){
        el.innerHTML = '<span class="fname att-expired">' + esc((a.name || 'file') + ' — ' + (T().mediaExpired || '')) + '</span>';
        row.appendChild(el);
        return;
      }
      const isImg = a.mime && a.mime.startsWith('image/');
      const isVid = a.mime && a.mime.startsWith('video/');
      const isAud = a.mime && a.mime.startsWith('audio/');
      const bindAsset = u => {
        if (!u){
          el.innerHTML = '<span class="fname">' + esc(a.name || 'file') + '</span>';
          return;
        }
        if (isImg){
          el.innerHTML = '<img alt="" loading="lazy">';
          const im = el.querySelector('img');
          im.src = u; im.style.cursor = 'zoom-in';
          im.onclick = () => openLightbox(u);
          im.onerror = () => { el.innerHTML = '<span class="fname">' + esc(a.name || 'image') + '</span>'; };
        } else if (isVid){
          el.style.cssText = 'padding:4px;max-width:240px';
          el.innerHTML = '<video controls playsinline preload="metadata" style="max-width:228px;max-height:150px;border-radius:10px;display:block"></video>';
          el.querySelector('video').src = u;
        } else if (isAud){
          el.style.cssText = 'padding:6px 10px';
          el.innerHTML = '<audio controls preload="metadata" style="height:34px;max-width:230px"></audio>';
          el.querySelector('audio').src = u;
        } else {
          const lk = document.createElement('a');

async function regenLast(){

  let ui = -1;
  for (let k = S.msgs.length - 1; k >= 0; k--) if (S.msgs[k].role === 'user'){ ui = k; break; }
  if (ui < 0) return;
  const um = S.msgs[ui], all = um.atts || [];
  const atts = [];
  for (const a of all){
    if (!a) continue;
    if (a.file){ atts.push(a); continue; }
    if (a.id && !a.expired){
      const rec = await mediaGetOrFetch(a.id);
      if (rec && rec.blob){
        const f = new File([rec.blob], a.name || rec.name || 'file', {type: a.mime || rec.mime || rec.blob.type || 'application/octet-stream'});
        a.file = f;
        atts.push(a);
      }
    }
  }
  const lostMedia = all.some(a => a && !a.file && /^(image|video|audio)\//i.test(a.mime || ''));
  if (lostMedia || (!String(um.content || '').trim() && !atts.length && !um.docs)){ toast(T().attGone, true); return; }
  mediaDel(mediaIdsOf(S.msgs.splice(ui + 1)));
  if (S.cur >= 0 && S.sessions[S.cur]) S.sessions[S.cur].msgs = S.msgs;
  const th = $('#thread');
  while (th.lastElementChild && !th.lastElementChild.classList.contains('user')) th.lastElementChild.remove();

}

  const vw = document.body.clientWidth || window.innerWidth;

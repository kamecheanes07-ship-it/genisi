      for(let attempt=0;attempt<2;attempt++){
      const response=await fetch(meta.space+meta.prefix+'/call/'+encodeURIComponent(meta.endpoint),{
        method:'POST',headers:{'content-type':'application/json'},credentials:'omit',signal:controller.signal,body:JSON.stringify({data})
      });
      const body=await response.text();
      if(!response.ok) throw new Error(route.name+' رفض الطلب (HTTP '+response.status+'): '+body.slice(0,220));
      const started=JSON.parse(body);
      if(!started||!started.event_id) throw new Error('لم تُرجع مساحة Qwen event_id');
      ai.eventId=started.event_id;
      const stream=await fetch(meta.space+meta.prefix+'/call/'+encodeURIComponent(meta.endpoint)+'/'+encodeURIComponent(started.event_id),{
        credentials:'omit',signal:controller.signal
      });
      if(!stream.ok) throw new Error('فشل فتح بث Qwen (HTTP '+stream.status+')');
      const reader=stream.body.getReader(),decoder=new TextDecoder();
      let buffer='',finished=false;
      while(!finished){
        const chunk=await reader.read();
        if(chunk.done) break;
        buffer+=decoder.decode(chunk.value,{stream:true});
        let boundary;
        while((boundary=buffer.indexOf('\n\n'))>=0){
          const block=buffer.slice(0,boundary);buffer=buffer.slice(boundary+2);
          finished=handleQwenSse(block)||finished;
        }
      }
      if(buffer.trim()) handleQwenSse(buffer);
      if(ai.received||ai.stopLoop) break;
      if(attempt===0) await new Promise(r=>setTimeout(r,900));
      }
      if(!ai.received&&!ai.stopLoop) throw new Error('انتهى بث Qwen دون نص. تحقق من endpoint chat_predict ومخطط المساحة.');
      return ai.received;
    } finally{
      ai.busy=false;
      if(ai.controller===controller) ai.controller=null;
      if(S.ctrl===controller) S.ctrl=null;
    }
  }

  /* v58.63 — نداء واحد غير متدفق لمحرك المحادثة (يستخدمه محسِّن برومت الوسائط refineOnce). */

  /* v58.63 — المرفقات غير الوسائطية كانت تُقرأ كلها كنص (file.text) حتى لو كانت PDF أو Word أو Excel،
     فيصل للنموذج حشو ثنائي غير مقروء (حتى 150 ألف حرف). الآن يُستخرج النص فعلياً:

  const DOC_MAX = 150000, DOCS_TOTAL_MAX = 300000;
  LIBS.pdf = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const extOf = n => (String(n || '').toLowerCase().match(/\.([a-z0-9]+)$/) || ['', ''])[1];
  const xmlEntities = s => String(s || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#(\d+);/g, (m, n) => { try { return String.fromCodePoint(+n); } catch(e){ return ''; } })
    .replace(/&#x([0-9a-f]+);/gi, (m, n) => { try { return String.fromCodePoint(parseInt(n, 16)); } catch(e){ return ''; } })
    .replace(/&amp;/g, '&');
  async function pdfText(file){
    await lib('pdf');
    const pdfjs = window.pdfjsLib;
    if (!pdfjs) throw new Error('pdf.js unavailable');
    pdfjs.GlobalWorkerOptions.workerSrc = PDF_WORKER;
    const doc = await pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    let out = '';
    try {
      for (let p = 1; p <= doc.numPages && out.length < DOC_MAX; p++){
        const tc = await (await doc.getPage(p)).getTextContent();
        out += tc.items.map(it => (it.str || '') + (it.hasEOL ? '\n' : '')).join('') + '\n\n';
      }
    } finally { try { doc.destroy(); } catch(e){} }
    return out.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  async function zipOf(file){ await lib('jszip'); return window.JSZip.loadAsync(await file.arrayBuffer()); }

    const zip = await zipOf(file), part = zip.file('word/document.xml');
    if (!part) throw new Error('not a DOCX file');
    const xml = await part.async('string');
    return xmlEntities(xml
      .replace(/<w:instrText\b[^>]*>[\s\S]*?<\/w:instrText>/g, '')
      .replace(/<w:tab\b[^>]*\/>/g, '\t').replace(/<w:(?:br|cr)\b[^>]*\/>/g, '\n')
      .replace(/<\/w:p>\s*<\/w:tc>/g, '\t').replace(/<\/w:tr>/g, '\n').replace(/<\/w:p>/g, '\n')
      .replace(/<[^>]+>/g, '')).replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();

  async function pptxText(file){
    const zip = await zipOf(file);
    const num = n => parseInt((n.match(/(\d+)\.xml$/) || [0, 0])[1], 10);
    const names = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
    if (!names.length) throw new Error('not a PPTX file');
    let out = '';
    for (let i = 0; i < names.length && out.length < DOC_MAX; i++){
      const xml = await zip.file(names[i]).async('string');
      out += '— ' + (i + 1) + ' —\n' + xmlEntities(xml.replace(/<\/a:p>/g, '\n').replace(/<a:br\b[^>]*\/>/g, '\n').replace(/<[^>]+>/g, '')).replace(/\n{2,}/g, '\n').trim() + '\n\n';
    }

  async function sheetText(file){
    await lib('xlsx');

      if (out.length >= DOC_MAX) break;

  async function readDoc(file){
    const ext = extOf(file.name), mime = String(file.type || '').toLowerCase();
    if (ext === 'pdf' || mime === 'application/pdf') return pdfText(file);
    if (ext === 'docx' || /wordprocessingml/.test(mime)) return docxText(file);
    if (ext === 'pptx' || /presentationml/.test(mime)) return pptxText(file);
    if (/^(xlsx|xlsm|xls|ods)$/.test(ext) || /spreadsheetml|ms-excel|opendocument\.spreadsheet/.test(mime)) return sheetText(file);
    const head = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
    if (head[0] === 0xFF && head[1] === 0xFE) return new TextDecoder('utf-16le').decode(await file.arrayBuffer());
    if (head[0] === 0xFE && head[1] === 0xFF) return new TextDecoder('utf-16be').decode(await file.arrayBuffer());

    for (let i = 0; i < head.length; i++){ const c = head[i]; if (c === 0) return null; if (c < 9 || (c > 13 && c < 32 && c !== 27)) ctl++; }
    if (head.length && ctl / head.length > 0.1) return null;
    return file.text();
  }

          const blob=await(await fetch(a.url,{credentials:'same-origin'})).blob();
          file=new File([blob],a.name||'file',{type:mime||blob.type||'application/octet-stream'});
        }catch(e){}
      }
      if(!file){ failed++; continue; }
      if(/^image\//i.test(mime)){ if(!files.image) files.image=file; else skipped++; }
      else if(/^video\//i.test(mime)){ if(!files.video) files.video=file; else skipped++; }
      else if(/^audio\//i.test(mime)){
        if(!files.audio) files.audio=file; else skipped++;
      }
      else{
        let content=null;
        try{content=await readDoc(file);}
        catch(e){content=null;try{console.warn('[attachment]',a.name,e);}catch(_){}}
        content=content==null?'':String(content).replace(/\u0000/g,'').trim();
        const room=Math.min(DOC_MAX,DOCS_TOTAL_MAX-docs.length);
        if(content&&room>200){
          if(content.length>room){content=content.slice(0,room);trunc++;}
          const fence=content.indexOf('```')>=0?'~~~~':'```';
          docs+='\n\n[ملف مرفق: '+a.name+']\n'+fence+'\n'+content+'\n'+fence;
        }else if(content){trunc++;}
        else{
          failed++;
          docs+='\n\n[ملف مرفق: '+a.name+' — تعذّر استخراج نص منه (ملف ثنائي، أو ممسوح ضوئياً، أو فارغ). أخبر المستخدم بذلك.]';
        }
      }
    }
    try{
      if(skipped) toast(T().filesSkipped,true);
      else if(failed) toast(T().docFail,true);
      else if(trunc) toast(T().docTrunc);
    }catch(e){}
    return {files,docs};
  };

    const r0 = await fetch(callUrl, {

      headers: {'content-type': 'application/json'},
      credentials: 'omit',
      signal: signal,
      body: JSON.stringify({data: data})
    });
    const j0 = await r0.json();
    if (!r0.ok || !j0 || !j0.event_id) throw new Error('تعذّر بدء جلسة المحادثة الصوتية');
    const stream = await fetch(callUrl + '/' + encodeURIComponent(j0.event_id), {credentials: 'omit', signal: signal});
    if (!stream.ok || !stream.body) throw new Error('انقطع بث المحادثة الصوتية');
    const reader = stream.body.getReader(), dec = new TextDecoder();
    let buf = '', latest = '', done = false;
    const parseBlk = blk => {
      let ev = '';
      const ds = [];
      for (const line of blk.replace(/\r/g, '').split('\n')){
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) ds.push(line.slice(5).trim());
      }
      if (ev === 'error') throw new Error('خطأ من مزوّد المحادثة');
      if (ev !== 'generating' && ev !== 'complete') return;
      try {
        const txt = qwenAssistantText(JSON.parse(ds.join('\n')));
        if (txt !== null){
          latest = txt;
          if (typeof opts.onDelta === 'function') opts.onDelta(latest);
        }
      } catch(e){}
      if (ev === 'complete') done = true;
    };
    while (!done){
      const ch = await reader.read();
      if (ch.done) break;
      buf += dec.decode(ch.value, {stream: true});
      let ix;
      while ((ix = buf.indexOf('\n\n')) >= 0){
        const blk = buf.slice(0, ix); buf = buf.slice(ix + 2);
        parseBlk(blk);
      }
    }
    if (!done && buf.trim()) parseBlk(buf);
    return latest;
  };

async function solveAtlasProof(prefix,bits){
  if(!window.crypto||!window.crypto.subtle)throw new Error('WebCrypto غير متاح. افتح الموقع عبر HTTPS.');
  const encoder=new TextEncoder();
  for(let n=0;n<5000000;n++){
    const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',encoder.encode(prefix+':'+n)));
    let zeros=0;for(const b of digest){if(b===0){zeros+=8;continue;}zeros+=Math.clz32(b)-24;break;}
    if(zeros>=bits)return String(n);
    if((n&1023)===1023)await new Promise(resolve=>setTimeout(resolve,0));
  }
  throw new Error('تعذر إكمال اختبار الحماية؛ حدّث الاختبار.');
}

function imageToCompactData(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//i.test(file.type)||file.size>12*1024*1024){reject(new Error('file'));return;}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const scale=Math.min(1,640/Math.max(img.naturalWidth,img.naturalHeight));
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      const ctx=canvas.getContext('2d');if(!ctx){reject(new Error('canvas'));return;}ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const convert=(quality)=>canvas.toBlob(blob=>{
        if(!blob){reject(new Error('encode'));return;}
        if(blob.size>420000&&quality>0.5){convert(quality-0.12);return;}
        if(blob.size>520000){reject(new Error('large'));return;}
        const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(new Error('read'));reader.readAsDataURL(blob);
      },'image/webp',quality);
      convert(0.78);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('decode'));};img.src=url;
  });
}

/* =====================================================================
   Encrypted HF Dataset Media Persistence (Images, Videos, Music, Files)
   with Automatic 15-Day Non-Use Expiration & Activity Refresh
   ===================================================================== */
{
  const syncedCloudMediaIds = new Set();
  const pendingTouchIds = new Set();
  const recentTouchAt = new Map();
  let mediaTouchTimer = null;

  function markAssetExpiredEverywhere(aid){
    if (!aid) return;
    let changed = false;
    const scanMsgs = msgs => {
      if (!Array.isArray(msgs)) return;
      for (const m of msgs){
        if (!m) continue;
        if (Array.isArray(m.media)){
          for (const x of m.media){
            if (x && x.id === aid && !x.expired){ x.expired = true; changed = true; }
          }
        }
        if (Array.isArray(m.atts)){
          for (const a of m.atts){
            if (a && a.id === aid && !a.expired){ a.expired = true; changed = true; }
          }
        }
      }
    };
    scanMsgs(S.msgs);
    for (const s of S.sessions || []) scanMsgs(s && s.msgs);
    if (changed) saveHistory();
  }

  syncMediaBlobHook = async function(aid, blob, meta){
    if (!S.token || !aid || !(blob instanceof Blob) || !blob.size || blob.size > 25165824) return null;
    if (syncedCloudMediaIds.has(aid)) return null;
    meta = meta || {};
    const qs = new URLSearchParams({
      id: String(aid),
      kind: String(meta.kind || 'file'),
      name: String(meta.name || 'asset.bin').slice(0, 140),
      mime: String(meta.mime || blob.type || 'application/octet-stream').slice(0, 120)
    });
    const headers = {'Content-Type': String(meta.mime || blob.type || 'application/octet-stream')};
    const csrf = atlasCookie('genisi_csrf');
    if (csrf) headers['X-CSRF-Token'] = csrf;
    try {
      const r = await fetch('/api/media/upload?' + qs.toString(), {
        method: 'POST',
        headers: headers,
        body: blob,
        credentials: 'include',
        cache: 'no-store'
      });
      if (r.ok){
        syncedCloudMediaIds.add(aid);
        return await r.json().catch(() => null);
      }
    } catch(e){}
    return null;
  };

  syncMediaUrlHook = async function(aid, url, meta){
    if (!S.token || !aid || !/^https:\/\//i.test(String(url || ''))) return null;
    if (syncedCloudMediaIds.has(aid)) return null;
    meta = meta || {};
    try {
      const res = await apiJ('/api/media/store-url', {
        method: 'POST',
        body: JSON.stringify({
          url: String(url),
          asset_id: String(aid),
          kind: String(meta.kind || 'video'),
          name: String(meta.name || 'media.mp4').slice(0, 140),
          mime: String(meta.mime || '')
        })
      });
      if (res && res.ok) syncedCloudMediaIds.add(aid);
      return res;
    } catch(e){ return null; }
  };

  touchMediaDbHook = function(aid){
    if (!S.token || !aid) return;
    const now = Date.now(), last = recentTouchAt.get(aid) || 0;
    if (now - last < 15 * 60 * 1000) return;
    recentTouchAt.set(aid, now);
    pendingTouchIds.add(String(aid));
    clearTimeout(mediaTouchTimer);
    mediaTouchTimer = setTimeout(async () => {
      if (!S.token || !pendingTouchIds.size) return;
      const ids = Array.from(pendingTouchIds).slice(0, 80);
      pendingTouchIds.clear();
      try { await api('/api/media/touch', {method: 'POST', body: JSON.stringify({ids: ids})}); } catch(e){}
    }, 2200);
  };

  deleteMediaDbHook = async function(ids){
    if (!S.token || !Array.isArray(ids) || !ids.length) return;
    for (const id of ids) syncedCloudMediaIds.delete(id);
    try { await api('/api/media/delete', {method: 'POST', body: JSON.stringify({ids: ids.slice(0, 200)})}); } catch(e){}
  };

  fetchMediaDbHook = async function(aid){
    if (!aid) return null;
    try {
      const r = await fetch('/api/media/' + encodeURIComponent(String(aid)), {credentials: 'include', cache: 'no-store'});
      if (r.status === 410){
        markAssetExpiredEverywhere(aid);
        return {expired: true};
      }
      if (!r.ok) return null;
      const blob = await r.blob();
      if (!blob || !blob.size) return null;
      syncedCloudMediaIds.add(aid);
      return {blob: blob, mime: r.headers.get('content-type') || blob.type || 'application/octet-stream'};
    } catch(e){ return null; }
  };

  window.syncPendingSessionMedia = async function(){
    if (!S.token) return;
    const seen = new Set();
    for (const sess of S.sessions || []){
      for (const m of (sess && sess.msgs) || []){
        for (const a of (m && m.atts) || []){
          if (a && a.id && !a.expired && !seen.has(a.id)){
            seen.add(a.id);
            const rec = await mediaGet(a.id);
            if (rec && rec.blob) await syncMediaBlobHook(a.id, rec.blob, {kind: a.kind || 'file', name: a.name || '', mime: a.mime || rec.mime || ''});
          }
        }
        for (const x of (m && m.media) || []){
          if (x && x.id && !x.expired && !seen.has(x.id)){
            seen.add(x.id);
            const rec = await mediaGet(x.id);
            if (rec && rec.blob) await syncMediaBlobHook(x.id, rec.blob, {kind: x.kind || 'file', name: x.name || x.title || '', mime: rec.mime || ''});
            else if (x.url && /^https:\/\//i.test(x.url)) await syncMediaUrlHook(x.id, x.url, {kind: x.kind || 'video', name: x.name || x.title || ''});
          }
        }
      }
    }
  };
}

  function detectSpokenLang(text, hint){
    const h = String(hint || '').trim().toLowerCase();
    if (/^(ar|fr|en|es|de|it|pt|ru|tr|zh|ja|ko)\b/.test(h)) return h;
    const s = String(text || '');
    if (/[\u0600-\u06FF]/.test(s)) return 'ar';
    if (/[\u4E00-\u9FFF]/.test(s)) return 'zh';
    if (/[\u3040-\u30FF]/.test(s)) return 'ja';
    if (/[\uAC00-\uD7AF]/.test(s)) return 'ko';
    if (/[\u0400-\u04FF]/.test(s)) return 'ru';
    if (/\b(bonjour|merci|avec|pour|dans|est-ce|comment|vous|nous|très|bien)\b/i.test(s)) return 'fr';
    if (/\b(hola|gracias|para|como|estás|buenos|por qué)\b/i.test(s)) return 'es';
    if (/[a-zA-Z]/.test(s)) return S.lang === 'fr' ? 'fr' : 'en';
    return S.lang === 'fr' ? 'fr' : S.lang === 'en' ? 'en' : 'ar';
  }

  function bcp47ForSpeech(langCode){
    const base = String(langCode || '').toLowerCase();
    if (base.startsWith('ar-')) return langCode;
    if (base === 'ar') return 'ar-DZ';
    if (base === 'fr') return 'fr-FR';
    if (base === 'es') return 'es-ES';
    if (base === 'de') return 'de-DE';
    if (base === 'zh') return 'zh-CN';
    if (base === 'ja') return 'ja-JP';
    if (base === 'ko') return 'ko-KR';
    if (base === 'ru') return 'ru-RU';
    if (base === 'tr') return 'tr-TR';
    return 'en-US';
  }

  function autoVoiceInstruction(spokenText, userText, metaVoice){
    const mv = String(metaVoice || '').trim();
    if (mv && mv.length >= 8) return mv.slice(0, 260);
    const u = String(userText || '').toLowerCase();
    if (/صوت\s*(?:أنث|انث|فتاة|امرأ|بنت)|female\s+voice|voix\s+f[ée]minine/i.test(u)){
      return 'Warm, expressive young adult female voice, clear natural articulation, gentle conversational pace, studio quality';
    }
    if (/صوت\s*(?:رجل|رجولي|ذكر|عميق)|male\s+voice|deep\s+voice|voix\s+masculine/i.test(u)){
      return 'Warm, confident young adult male voice, rich clear timbre, natural conversational rhythm, studio quality';
    }
    if (/قصة|حكاية|رواية|story|raconte/i.test(u)){
      return 'Expressive, engaging storyteller voice, warm resonance, nuanced emotion and natural pauses, studio quality';
    }
    if (/هادئ|استرخاء|calm|soothing|doux/i.test(u)){
      return 'Calm, soothing, gentle voice, relaxed warm tone, unhurried pace, clean intimate studio recording';
    }
    if (voiceState.personaVoice) return voiceState.personaVoice;
    return 'Warm, natural, articulate young adult voice, friendly conversational rhythm, clear studio quality';
  }

  function extractVoiceMeta(raw){
    let txt = String(raw || '');
    txt = txt.replace(/<thinking>[\s\S]*?<\/thinking>/gi, '').replace(/<thinking>[\s\S]*$/i, '');
    txt = txt.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/<think>[\s\S]*$/i, '');
    let lang = '', voice = '';
    txt = txt.replace(/<voice_meta>\s*([\s\S]*?)\s*<\/voice_meta>/gi, (_, inner) => {
      try {
        const j = JSON.parse(inner.trim());
        if (j && typeof j.lang === 'string') lang = j.lang.trim();
        if (j && typeof j.voice === 'string') voice = j.voice.trim();
      } catch(e){}
      return '';
    });
    txt = txt.replace(/<voice_meta>[\s\S]*$/i, '');
    txt = txt.replace(/```[\s\S]*?```/g, ' ').replace(/`([^`]+)`/g, '$1');
    txt = txt.replace(/^\s*#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1');
    txt = txt.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '$1');
    return {cleanText: txt.replace(/\s+/g, ' ').trim(), lang: lang, voice: voice};
  }

  function splitSpokenChunks(text){
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean) return [];
    if (clean.length <= 320) return [clean];
    const parts = clean.split(/(?<=[.!؟?\n؛;])\s+/u).map(s => s.trim()).filter(Boolean);
    const chunks = [];
    let cur = '';
    for (const p of parts){
      const limit = chunks.length === 0 ? 240 : 520;
      if (cur && (cur.length + 1 + p.length) > limit){
        chunks.push(cur);
        cur = p;
      } else {
        cur = cur ? (cur + ' ' + p) : p;
      }
    }
    if (cur) chunks.push(cur);
    return chunks.slice(0, 6);
  }

  async function synthesizeVoxCPM(spokenText, controlInstruction, langCode, signal){
    const text = String(spokenText || '').trim().slice(0, 1100);
    if (!text) return null;
    const hasNonEnZh = /[\u0600-\u06FF\u0400-\u04FF\u3040-\u30FF\uAC00-\uD7AFàâçéèêëîïôûùüÿñáíóúäöüß]/i.test(text);
    const baseLang = String(langCode || '').toLowerCase();
    const doNormalize = !hasNonEnZh && (baseLang.startsWith('en') || baseLang.startsWith('zh'));

    // 1) Try same-origin FastAPI proxy (/api/voice/tts -> openbmb/VoxCPM-Demo)
    if (!voiceState.anchorBlob){
      try {
        const res = await fetch('/api/voice/tts', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          signal: signal,
          body: JSON.stringify({
            text: text,
            control_instruction: controlInstruction,
            cfg_value: 2.0,
            do_normalize: doNormalize
          })
        });
        if (res.ok && /^audio\//i.test(res.headers.get('content-type') || '')){
          const blob = await res.blob();
          if (blob && blob.size > 200){
            voiceState.anchorBlob = blob;
            return blob;
          }
        }
      } catch(e){
        if (e && e.name === 'AbortError') throw e;
      }
    }

    // 2) Direct browser Gradio fallback to https://openbmb-voxcpm-demo.hf.space
    const meta = await ai.discoverGradio(VOXCPM_SPACE_URL, 'generate');
    let refFile = voiceState.anchorFileData || null;
    if (!refFile && voiceState.anchorBlob && typeof ai.uploadFilesToSpace === 'function'){
      try {
        const f = new File([voiceState.anchorBlob], 'voice-anchor.wav', {type: voiceState.anchorBlob.type || 'audio/wav'});
        const up = await ai.uploadFilesToSpace(meta, {ref: f}, signal);
        if (up && up.ref) { voiceState.anchorFileData = up.ref; refFile = up.ref; }
      } catch(e){}
    }
    const callData = [
      text,
      refFile ? '' : String(controlInstruction || ''),
      refFile,
      false,
      '',
      2.0,
      doNormalize,
      false
    ];
    const callUrl = meta.space + meta.prefix + '/call/' + encodeURIComponent(meta.endpoint);
    const r0 = await fetch(callUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'omit',
      signal: signal,
      body: JSON.stringify({data: callData})
    });
    const j0 = await r0.json();
    if (!r0.ok || !j0 || !j0.event_id) throw new Error('تعذّر الاتصال بمحرك الصوت VoxCPM');
    const stream = await fetch(callUrl + '/' + encodeURIComponent(j0.event_id), {credentials: 'omit', signal: signal});
    if (!stream.ok || !stream.body) throw new Error('انقطع بث محرك الصوت VoxCPM');
    const reader = stream.body.getReader(), dec = new TextDecoder();
    let buf = '', audioOutUrl = '', done = false;
    const parseEvt = blk => {
      let ev = '';
      const ds = [];
      for (const l of blk.replace(/\r/g, '').split('\n')){
        if (l.startsWith('event:')) ev = l.slice(6).trim();
        else if (l.startsWith('data:')) ds.push(l.slice(5).trim());
      }
      if (ev === 'error') throw new Error('خطأ في توليد الصوت عبر VoxCPM');
      if (ev !== 'complete') return;
      try {
        const parsed = JSON.parse(ds.join('\n'));
        const item = Array.isArray(parsed) ? parsed[0] : parsed;
        if (typeof item === 'string') audioOutUrl = item;
        else if (item && typeof item === 'object'){
          if (item.url) audioOutUrl = item.url;
          else if (item.path) audioOutUrl = meta.space + meta.prefix + '/file=' + item.path;
        }
      } catch(e){}
      done = true;
    };
    while (!done){
      const c = await reader.read();
      if (c.done) break;
      buf += dec.decode(c.value, {stream: true});
      let ix;
      while ((ix = buf.indexOf('\n\n')) >= 0){
        const blk = buf.slice(0, ix); buf = buf.slice(ix + 2);
        parseEvt(blk);
      }
    }
    if (!done && buf.trim()) parseEvt(buf);
    if (!audioOutUrl) throw new Error('لم يُرجع محرك VoxCPM مقطعاً صوتياً');
    if (audioOutUrl.startsWith('/')) audioOutUrl = meta.space + audioOutUrl;
    const ar = await fetch(audioOutUrl, {credentials: 'omit', signal: signal});
    if (!ar.ok) throw new Error('تعذّر تحميل الصوت المولّد');
    const blob = await ar.blob();
    if (!voiceState.anchorBlob && blob && blob.size > 200) voiceState.anchorBlob = blob;
    return blob;
  }

  function ensureAudioContext(){
    if (!voiceState.audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) voiceState.audioCtx = new Ctx();
    }
    if (voiceState.audioCtx && voiceState.audioCtx.state === 'suspended'){
      voiceState.audioCtx.resume().catch(() => {});
    }
    return voiceState.audioCtx;
  }

  function startVisualizerLoop(analyser){
    cancelAnimationFrame(voiceState.rafId);
    const stage = $('#voiceStageBox');
    const bars = stage ? [...stage.querySelectorAll('.voice-bars i')] : [];
    const data = analyser ? new Uint8Array(analyser.frequencyBinCount) : null;
    const tick = ts => {
      if (!voiceState.open || (voiceState.mode !== 'listening' && voiceState.mode !== 'speaking')){
        if (stage) stage.style.setProperty('--v-level', '1');
        bars.forEach(b => { b.style.height = '10px'; });
        return;
      }
      let avg = 0;
      if (analyser && data){
        analyser.getByteFrequencyData(data);
        let sum = 0;
        const n = Math.min(data.length, 48);
        for (let i = 0; i < n; i++) sum += data[i];
        avg = (sum / Math.max(1, n)) / 255;
      }
      if (avg < 0.02 && voiceState.mode === 'speaking'){
        avg = 0.22 + 0.16 * Math.abs(Math.sin(ts / 150));
      }
      const level = Math.min(1, avg * 1.85);
      if (stage) stage.style.setProperty('--v-level', (1 + level * 0.42).toFixed(3));
      const weights = [0.62, 0.92, 1.18, 0.88, 0.65];
      bars.forEach((b, idx) => {
        const wave = 0.85 + 0.25 * Math.sin(ts / 120 + idx * 1.1);
        const h = Math.round(9 + Math.min(24, level * 24 * weights[idx % weights.length] * wave));
        b.style.height = h + 'px';
      });
      voiceState.rafId = requestAnimationFrame(tick);
    };
    voiceState.rafId = requestAnimationFrame(tick);
  }

  function playBlobSegment(blob, signal){
    return new Promise((resolve, reject) => {
      if (!blob || !blob.size){ resolve(); return; }
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.preload = 'auto';
      voiceState.currentAudio = audio;
      let analyser = null;
      try {
        const ctx = ensureAudioContext();
        if (ctx){
          analyser = ctx.createAnalyser();
          analyser.fftSize = 128;
          const src = ctx.createMediaElementSource(audio);
          src.connect(analyser);
          analyser.connect(ctx.destination);
        }
      } catch(e){ analyser = null; }
      startVisualizerLoop(analyser);
      const cleanup = () => {
        if (voiceState.currentAudio === audio) voiceState.currentAudio = null;
        URL.revokeObjectURL(url);
      };
      const onAbort = () => {
        try { audio.pause(); } catch(e){}
        cleanup();
        reject(new DOMException('Interrupted', 'AbortError'));
      };
      if (signal){
        if (signal.aborted){ onAbort(); return; }
        signal.addEventListener('abort', onAbort, {once: true});
      }
      audio.onended = () => {
        if (signal) signal.removeEventListener('abort', onAbort);
        cleanup();
        resolve();
      };
      audio.onerror = () => {
        if (signal) signal.removeEventListener('abort', onAbort);
        cleanup();
        resolve();
      };
      audio.play().catch(err => {
        if (signal) signal.removeEventListener('abort', onAbort);
        cleanup();
        reject(err);
      });
    });
  }

  function stopMicResources(){
    clearTimeout(voiceState.silenceTimer);
    voiceState.silenceTimer = null;
    if (voiceState.recognition){
      try { voiceState.recognition.onend = null; voiceState.recognition.stop(); } catch(e){}
      voiceState.recognition = null;
    }
    if (voiceState.mediaRecorder && voiceState.mediaRecorder.state !== 'inactive'){
      try { voiceState.mediaRecorder.stop(); } catch(e){}
    }
    voiceState.mediaRecorder = null;
    if (voiceState.micStream){
      try { voiceState.micStream.getTracks().forEach(t => t.stop()); } catch(e){}
      voiceState.micStream = null;
    }
  }

  function interruptVoiceCall(resumeListening){
    if (voiceState.turnCtl){ try { voiceState.turnCtl.abort(); } catch(e){} voiceState.turnCtl = null; }
    if (voiceState.ttsCtl){ try { voiceState.ttsCtl.abort(); } catch(e){} voiceState.ttsCtl = null; }
    if (voiceState.currentAudio){ try { voiceState.currentAudio.pause(); } catch(e){} voiceState.currentAudio = null; }
    stopMicResources();
    setVoiceMode('idle');
    if (resumeListening && voiceState.open) setTimeout(() => { if (voiceState.open && voiceState.mode === 'idle') startVoiceListening(); }, 180);
  }

  async function startVoiceListening(){
    if (!voiceState.open || voiceState.mode === 'listening') return;
    interruptVoiceCall(false);
    ensureAudioContext();
    voiceState.interimText = '';
    voiceState.finalSpeechText = '';
    voiceState.recChunks = [];
    voiceState.hadSpeech = false;

    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    } catch(e){
      toast(S.lang === 'ar' ? 'تعذّر الوصول إلى الميكروفون — يمكنك الكتابة في الشريط السفلي أو منح الإذن.' : 'Microphone permission denied — you can type below.', true);
      setVoiceMode('idle');
      return;
    }
    if (!voiceState.open){ stream.getTracks().forEach(t => t.stop()); return; }
    voiceState.micStream = stream;
    setVoiceMode('listening');
    setVoiceCaption(T().voiceListening, true);

    let analyser = null;
    try {
      const ctx = ensureAudioContext();
      if (ctx){
        analyser = ctx.createAnalyser();
        analyser.fftSize = 128;
        const src = ctx.createMediaStreamSource(stream);
        src.connect(analyser);
        voiceState.micAnalyser = analyser;
      }
    } catch(e){}
    startVisualizerLoop(analyser);

    // Record audio simultaneously so if SpeechRecognition isn't supported or returns empty, Qwen3.5-Omni receives native audio!
    let recMime = 'audio/webm';
    if (window.MediaRecorder){
      for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']){
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)){ recMime = m; break; }
      }
      try {
        const mr = new MediaRecorder(stream, {mimeType: recMime});
        mr.ondataavailable = ev => { if (ev.data && ev.data.size > 0) voiceState.recChunks.push(ev.data); };
        mr.start(250);
        voiceState.mediaRecorder = mr;
      } catch(e){}
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR){
      try {
        const rec = new SR();
        rec.lang = bcp47ForSpeech(voiceState.personaLang || S.lang);
        rec.interimResults = true;
        rec.continuous = true;
        rec.onresult = ev => {
          let interim = '', fin = '';
          for (let i = 0; i < ev.results.length; i++){
            const r = ev.results[i];
            if (r.isFinal) fin += r[0].transcript + ' ';
            else interim += r[0].transcript;
          }
          voiceState.finalSpeechText = fin.trim();
          voiceState.interimText = interim.trim();
          const combined = (voiceState.finalSpeechText + ' ' + voiceState.interimText).trim();
          if (combined){
            voiceState.hadSpeech = true;
            setVoiceCaption(combined, false);
            clearTimeout(voiceState.silenceTimer);
            voiceState.silenceTimer = setTimeout(() => {
              if (voiceState.mode === 'listening') stopVoiceListening(true);
            }, 1500);
          }
        };
        rec.onerror = () => {};
        rec.onend = () => {
          if (voiceState.mode === 'listening' && voiceState.hadSpeech){
            stopVoiceListening(true);
          }
        };
        rec.start();
        voiceState.recognition = rec;
      } catch(e){}
    } else if (analyser){
      // Acoustic VAD silence detector when browser lacks SpeechRecognition
      const vadBuf = new Uint8Array(analyser.frequencyBinCount);
      let silentSince = 0;
      const checkVad = () => {
        if (voiceState.mode !== 'listening' || !voiceState.micStream) return;
        analyser.getByteFrequencyData(vadBuf);
        let s = 0;
        for (let i = 0; i < 32; i++) s += vadBuf[i];
        const lv = (s / 32) / 255;
        if (lv > 0.085){
          voiceState.hadSpeech = true;
          silentSince = 0;
        } else if (voiceState.hadSpeech){
          if (!silentSince) silentSince = Date.now();
          else if (Date.now() - silentSince > 1550){
            stopVoiceListening(true);
            return;
          }
        }
        setTimeout(checkVad, 120);
      };
      setTimeout(checkVad, 250);
    }
  }

  async function stopVoiceListening(commitTurn){
    if (voiceState.mode !== 'listening') return;
    const mr = voiceState.mediaRecorder;
    let audioBlob = null;
    if (mr && mr.state !== 'inactive'){
      audioBlob = await new Promise(res => {
        mr.onstop = () => {
          const b = voiceState.recChunks.length ? new Blob(voiceState.recChunks, {type: mr.mimeType || 'audio/webm'}) : null;
          res(b);
        };
        try { mr.stop(); } catch(e){ res(null); }
      });
    }
    const transcript = (voiceState.finalSpeechText + ' ' + voiceState.interimText).trim();
    const hadVoice = voiceState.hadSpeech;
    stopMicResources();
    if (!commitTurn){
      setVoiceMode('idle');
      return;
    }
    if (!transcript && (!audioBlob || audioBlob.size < 1200 || !hadVoice)){
      setVoiceMode('idle');
      setVoiceCaption(T().voiceReady, true);
      return;
    }
    await executeVoiceCallTurn(transcript, audioBlob);
  }

  async function submitVoiceTextTurn(){
    const vIn = $('#voiceInput');
    if (!vIn) return;
    const text = vIn.value.trim();
    if (!text && !S.attachments.length) return;
    interruptVoiceCall(false);
    vIn.value = '';
    refreshVoiceBar();
    await executeVoiceCallTurn(text, null);
  }

  function ensureActiveChatSession(seedTitle){
    if (!Array.isArray(S.sessions)) S.sessions = [];
    if (!Number.isInteger(S.cur) || S.cur < -1 || S.cur >= S.sessions.length) S.cur = -1;
    if (S.cur === -1){
      if (S.sessions.length >= 40){ const old = S.sessions.shift(); mediaDel(mediaIdsOf(old && old.msgs)); }
      const sess = {title: String(seedTitle || T().tVoiceCall || 'Voice Call').slice(0, 60), msgs: S.msgs, ts: Date.now()};
      S.sessions.push(sess);
      S.cur = S.sessions.length - 1;
    } else if (S.sessions[S.cur]){
      S.sessions[S.cur].msgs = S.msgs;
    }
  }

  async function executeVoiceCallTurn(userText, rawMicBlob){
    if (!voiceState.open) return;
    const ctl = new AbortController();
    voiceState.turnCtl = ctl;
    setVoiceMode('thinking');

    const queuedAtts = S.attachments.splice(0, S.attachments.length);
    renderAttach();
    const displayUserText = userText || (S.lang === 'ar' ? '🎙️ رسالة صوتية' : S.lang === 'fr' ? '🎙️ Message vocal' : '🎙️ Voice message');
    setVoiceCaption(displayUserText, true);

    const um = {role: 'user', content: displayUserText};
    if (queuedAtts.length){
      um.atts = queuedAtts.map(a => ({
        id: a.id, kind: a.kind, name: a.name, mime: a.mime, size: a.size,
        url: a.url, dbUrl: a.dbUrl || (a.id ? '/api/media/' + a.id : ''), file: a.file
      }));
    }
    addUserBubble(displayUserText, um.atts);
    S.msgs.push(um);
    ensureActiveChatSession(userText || T().tVoiceCall);

    try {
      const parsedAtts = queuedAtts.length ? await attsToFiles(queuedAtts) : {files: {}, docs: ''};
      if (um.atts && parsedAtts.docs) um.docs = parsedAtts.docs;
      let audioFile = parsedAtts.files.audio || null;
      if (!userText && rawMicBlob && rawMicBlob.size > 800){
        const ext = /mp4/i.test(rawMicBlob.type) ? 'm4a' : /ogg/i.test(rawMicBlob.type) ? 'ogg' : 'webm';
        audioFile = new File([rawMicBlob], 'voice-input.' + ext, {type: rawMicBlob.type || 'audio/webm'});
      }

      const hist = S.msgs.slice(0, -1).slice(-18).map(m => ({
        role: m.role,
        content: String(m.content || '')
      })).filter(m => m.content.trim());

      const sys = buildSystem() + '\n\n' + VOICE_CALL_PROMPT;
      const promptText = userText || 'Listen carefully to the user’s spoken audio message and reply naturally in the exact same language and dialect.';

      const rawReply = await ai.voiceTurn({
        text: promptText,
        audio: audioFile,
        image: parsedAtts.files.image || null,
        video: parsedAtts.files.video || null,
        docs: parsedAtts.docs || '',
        history: hist,
        system: sys,
        signal: ctl.signal,
        onDelta: partial => {
          const {cleanText} = extractVoiceMeta(partial);
          if (cleanText) setVoiceCaption(cleanText, false);
        }
      });

      if (ctl.signal.aborted || !voiceState.open) return;
      const {cleanText, lang, voice} = extractVoiceMeta(rawReply);
      const finalSpoken = cleanText || (S.lang === 'ar' ? 'أنا أستمع إليك.' : 'I am listening.');
      const chosenLang = detectSpokenLang(finalSpoken, lang || voiceState.personaLang);
      const chosenVoice = autoVoiceInstruction(finalSpoken, userText, voice);
      voiceState.personaLang = chosenLang;
      voiceState.personaVoice = chosenVoice;

      const metaBadge = $('#voiceAutoMeta');
      if (metaBadge) metaBadge.textContent = T().voiceAuto + ' · ' + chosenLang.toUpperCase();
      setVoiceCaption(finalSpoken, false);
      setVoiceMode('thinking', T().voiceSynth);

      // Append assistant message to conversation
      const aiMsg = {role: 'assistant', content: finalSpoken, media: []};
      S.msgs.push(aiMsg);
      const b = addBubble('assistant', finalSpoken);
      saveHistory(); renderSessions();

      // Synthesize & stream chunks via openbmb/VoxCPM-Demo
      const ttsCtl = new AbortController();
      voiceState.ttsCtl = ttsCtl;
      const chunks = splitSpokenChunks(finalSpoken);
      const synthPromises = chunks.map((ch, idx) =>
        idx === 0
          ? synthesizeVoxCPM(ch, chosenVoice, chosenLang, ttsCtl.signal)
          : null
      );

      let firstVoiceBlob = null;
      for (let i = 0; i < chunks.length; i++){
        if (ttsCtl.signal.aborted || !voiceState.open) break;
        if (!synthPromises[i]) synthPromises[i] = synthesizeVoxCPM(chunks[i], chosenVoice, chosenLang, ttsCtl.signal);
        if (i + 1 < chunks.length && !synthPromises[i + 1]){
          synthPromises[i + 1] = synthesizeVoxCPM(chunks[i + 1], chosenVoice, chosenLang, ttsCtl.signal).catch(() => null);
        }
        const blob = await synthPromises[i];
        if (ttsCtl.signal.aborted || !voiceState.open) break;
        if (blob && blob.size > 200){
          if (!firstVoiceBlob) firstVoiceBlob = blob;
          setVoiceMode('speaking');
          await playBlobSegment(blob, ttsCtl.signal);
        }
      }

      // Persist synthesized voice reply in conversation + encrypted HF Dataset DB (15-day TTL)
      if (firstVoiceBlob){
        const aid = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const vTitle = T().tVoiceCall + ' — Genisi';
        mediaPut(aid, firstVoiceBlob, {kind: 'audio', title: vTitle});
        if (syncMediaBlobHook) syncMediaBlobHook(aid, firstVoiceBlob, {kind: 'audio', name: 'genisi-voice.wav', mime: firstVoiceBlob.type || 'audio/wav'});
        aiMsg.media.push({id: aid, kind: 'audio', url: '/api/media/' + aid, title: vTitle});
        if (b){
          const mc = mediaCard(aiMsg.media[aiMsg.media.length - 1]);
          if (mc) b.appendChild(mc);
        }
        saveHistory(); renderGallery();
      }

      if (voiceState.open && !ttsCtl.signal.aborted){
        setVoiceMode('idle');
        if (voiceState.handsFree){
          setTimeout(() => {
            if (voiceState.open && voiceState.mode === 'idle') startVoiceListening();
          }, 320);
        }
      }
    } catch(e){
      if (e && e.name === 'AbortError') return;
      setVoiceMode('idle');
      const errMsg = (e && e.message) ? String(e.message).slice(0, 160) : T().errNet;
      setVoiceCaption(errMsg, true);
      toast(errMsg, true);
    }
  }

  function openVoiceCall(){
    initVoiceCallDom();
    closePops();
    ensureAudioContext();
    voiceState.open = true;
    voiceState.startedAt = Date.now();
    clearInterval(voiceState.timerId);
    const timerEl = $('#voiceTimer');
    if (timerEl) timerEl.textContent = '00:00';
    voiceState.timerId = setInterval(() => {
      if (!voiceState.open) return;
      const sec = Math.max(0, Math.floor((Date.now() - voiceState.startedAt) / 1000));
      if (timerEl) timerEl.textContent = formatCallClock(sec);
    }, 1000);

    $('#viewHome').classList.remove('on');
    $('#viewChat').classList.remove('on');
    $('#viewVoice').classList.add('on');
    document.body.classList.add('in-voice');
    setVoiceMode('idle');
    setVoiceCaption(T().voiceReady, true);
    renderAttach();
    refreshVoiceBar();
  }

  function closeVoiceCall(silent){
    if (!voiceState.open) return;
    voiceState.open = false;
    clearInterval(voiceState.timerId);
    voiceState.timerId = null;
    cancelAnimationFrame(voiceState.rafId);
    interruptVoiceCall(false);
    $('#viewVoice').classList.remove('on');
    document.body.classList.remove('in-voice');
    if (!silent){
      if (S.msgs && S.msgs.length){
        $('#viewHome').classList.remove('on');
        $('#viewChat').classList.add('on');
        if (composerEl.parentNode !== $('#chatSlot')) placeComposer(true);
        document.body.classList.add('in-chat');
        scrollBottom();
      } else {
        $('#viewChat').classList.remove('on');
        $('#viewHome').classList.add('on');
        placeComposer(false);
        document.body.classList.remove('in-chat');
      }
      renderAttach();
    }
  }

  openVoiceCallHook = openVoiceCall;
  closeVoiceCallHook = closeVoiceCall;
  refreshVoiceBarHook = refreshVoiceBar;

  const _applyLangVoiceBase = applyLang;
  applyLang = function(){
    _applyLangVoiceBase();
    initVoiceCallDom();
    syncVoiceLangLabels();
  };
  initVoiceCallDom();
}

// Load the signed HttpOnly session from the server; never restore a bearer token from localStorage.
try{localStorage.removeItem('g3_token');localStorage.removeItem('g3_hf_token');localStorage.removeItem('g3_hf_repo');}catch(e){}
setAuth(null,null);applyLang();renderSync('local');
(async function bootSecureAccount(){
  try{
    const r=await fetch('/api/auth/me',{credentials:'include',cache:'no-store'});
    if(r.ok){const j=await r.json();setAuth('cookie-session',j.user);await Promise.all([loadPreferences(),loadHistory(),loadWorkspace(),loadAgent()]);syncPendingSessionMedia();}
    else{setAuth(null,null);await loadPreferences();await loadHistory();}
  }catch(e){setAuth(null,null);await loadPreferences();await loadHistory();renderSync('error');}
  renderAvatar();renderHomeHero();renderSessions();renderGallery();renderPlanBadge();
})();
setTimeout(() => detect(false), 400);
})();
</script>
